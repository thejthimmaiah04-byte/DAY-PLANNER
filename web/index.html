<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ARC — Day Planner</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%230B0C10"/><path d="M15 41 A17 17 0 0 1 49 41" fill="none" stroke="%23D4B476" stroke-width="4.5" stroke-linecap="round"/><circle cx="32" cy="23" r="4" fill="%23D4B476"/><line x1="13" y1="48" x2="51" y2="48" stroke="%23504734" stroke-width="3" stroke-linecap="round"/></svg>'>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARC">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Fraunces'; src: url('fonts/fraunces_medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Fraunces'; src: url('fonts/fraunces_semibold.ttf'); font-weight: 600; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter_regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter_medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter_semibold.ttf'); font-weight: 600; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter_bold.ttf'); font-weight: 700; }

  :root {
    --ink: #050505;
    --surface1: #111111;
    --surface2: #1A1A1A;
    --hairline: #252525;
    --ivory: #F5F5F5;
    --ivory-dim: #999999;
    --ivory-faint: #555555;
    --gold: #FF5500;
    --gold-deep: #CC3300;
    --on-gold: #FFFFFF;
    --terracotta: #FF3B30;
    --sage: #30D158;
    --slate: #8E8E93;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #000000;
    color: var(--ivory);
    font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif;
    font-size: 15px;
    display: flex;
    justify-content: center;
  }

  #phone {
    width: 100%;
    max-width: 440px;
    height: 100dvh;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  @media (min-width: 500px) {
    #phone {
      height: min(920px, calc(100dvh - 32px));
      margin: 16px 0;
      border-radius: 28px;
      border: 1px solid var(--hairline);
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
  }

  main { flex: 1; overflow-y: auto; padding: 0 20px; scrollbar-width: none; }
  main::-webkit-scrollbar { display: none; }

  .serif { font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif; }

  .kicker {
    font-size: 11px; font-weight: 500; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--gold);
  }
  .display { font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.1; letter-spacing: -0.5px; }
  .screen-title { font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.2px; padding: 28px 0 16px; }
  .section-label {
    font-size: 10px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--ivory-faint); margin: 22px 0 10px;
  }

  /* ---- Lunch break row ---- */
  .lunch-break-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface1); border-radius: 14px;
    padding: 10px 14px; margin-bottom: 8px;
    border: 1px dashed rgba(255,85,0,0.25);
    opacity: 0.7;
  }
  .lunch-icon { font-size: 16px; }
  .lunch-label { font-size: 14px; font-weight: 600; color: var(--ivory); flex: 1; }
  .lunch-time { font-size: 12px; color: var(--ivory-faint); }

  /* ---- Task rows ---- */
  .task-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface1); border-radius: 14px;
    padding: 8px 12px; margin-bottom: 8px; cursor: pointer;
    transition: background .15s ease;
  }
  .task-row:hover { background: var(--surface2); }
  .check {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid var(--slate); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s ease; font-size: 14px; color: transparent;
  }
  .check.done { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
  .task-main { flex: 1; min-width: 0; }
  .task-title { font-size: 15px; line-height: 1.35; }
  .task-row.is-done .task-title { color: var(--ivory-faint); text-decoration: line-through; }
  .task-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12.5px; color: var(--ivory-dim); }
  .pdot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .task-time { font-size: 13px; font-weight: 600; color: var(--gold); white-space: nowrap; }

  /* ---- Progress bar text ---- */
  .progress-text { font-size: 13px; color: var(--ivory-dim); white-space: nowrap; }

  /* ---- Chips ---- */
  .chip-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 500;
    background: var(--surface1); color: var(--ivory-dim); border: 1px solid var(--hairline);
    cursor: pointer; transition: all .15s ease; user-select: none; font-family: inherit;
  }
  .chip.on { background: var(--gold); color: var(--on-gold); border-color: var(--gold); font-weight: 600; }

  /* ---- Empty state ---- */
  .empty { text-align: center; padding: 56px 0; }
  .empty-orb {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%;
    border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center;
  }
  .empty-orb::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  .empty h3 { font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif; font-weight: 700; font-size: 20px; margin-bottom: 6px; }
  .empty p { font-size: 13px; color: var(--ivory-dim); }

  /* ---- Bottom nav ---- */
  nav {
    flex: none; display: flex; background: var(--surface1);
    border-top: 1px solid var(--hairline);
    padding: 4px 8px calc(4px + env(safe-area-inset-bottom));
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 0; cursor: pointer; color: var(--ivory-faint);
    font-size: 9.5px; font-weight: 500; letter-spacing: .6px; border-radius: 10px;
  }
  .nav-item svg { width: 18px; height: 18px; }
  .nav-item.on { color: var(--gold); }

  /* ---- FAB ---- */
  #fab {
    position: absolute; right: 20px; bottom: 86px; width: 56px; height: 56px;
    border-radius: 18px; background: var(--gold); color: var(--on-gold);
    border: none; font-size: 26px; line-height: 1; cursor: pointer;
    box-shadow: 0 8px 24px rgba(212,180,118,.25); z-index: 5;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease;
  }
  #fab:hover { transform: scale(1.05); }

  /* ---- Sheet / modal ---- */
  #overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  #overlay.open { opacity: 1; pointer-events: auto; }
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 11;
    background: var(--surface1); border-radius: 24px 24px 0 0;
    padding: 12px 24px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s cubic-bezier(.3,.7,.3,1);
    max-height: 88%; overflow-y: auto; scrollbar-width: none;
  }
  #sheet::-webkit-scrollbar { display: none; }
  #sheet.open { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--hairline); margin: 0 auto 18px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sheet-title { font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif; font-weight: 700; font-size: 22px; }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--terracotta); font-size: 18px; padding: 6px; }

  input[type=text], textarea, input[type=date], input[type=time] {
    width: 100%; background: var(--ink); border: 1px solid var(--hairline);
    border-radius: 12px; color: var(--ivory); font-family: 'Inter', sans-serif;
    font-size: 15px; padding: 13px 14px; outline: none; transition: border-color .15s;
  }
  input:focus, textarea:focus { border-color: var(--gold); }
  textarea { resize: none; height: 68px; margin-top: 10px; }
  input[type=date], input[type=time] { color-scheme: dark; width: auto; }

  .field-label { font-size: 10px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ivory-faint); margin: 18px 0 8px; }
  .row { display: flex; align-items: center; gap: 10px; }

  .primary-btn {
    width: 100%; margin-top: 24px; padding: 15px; border: none; border-radius: 14px;
    background: var(--gold); color: var(--on-gold); font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s;
  }
  .primary-btn:disabled { opacity: .35; cursor: default; }

  /* toggle */
  .toggle { position: relative; width: 46px; height: 26px; flex: none; cursor: pointer; }
  .toggle input { display: none; }
  .toggle .tk {
    position: absolute; inset: 0; border-radius: 13px; background: var(--hairline); transition: background .15s;
  }
  .toggle .tk::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--ivory-dim); transition: all .15s;
  }
  .toggle input:checked + .tk { background: var(--gold); }
  .toggle input:checked + .tk::after { left: 23px; background: var(--on-gold); }

  /* ---- Calendar ---- */
  .cal-head { display: flex; align-items: center; padding: 28px 0 10px; }
  .cal-head .screen-title { padding: 0; flex: 1; }
  .cal-nav { background: none; border: none; color: var(--ivory-dim); font-size: 20px; cursor: pointer; padding: 8px 10px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 500; color: var(--ivory-faint); padding: 8px 0; letter-spacing: 1px; }
  .cal-cell-outer { display: flex; flex-direction: column; cursor: pointer; }
  .cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; gap: 2px; }
  .cal-bar-slot { display: flex; flex-direction: column; gap: 2px; padding: 2px 0 1px; }
  .cal-bar-inner { height: 3px; opacity: 0.55; pointer-events: none; }
  .cal-cell .n { font-size: 14px; font-weight: 600; }
  .cal-cell.today .n { color: var(--gold); }
  .cal-cell.today { background: var(--surface1); }
  .cal-cell.sel { background: var(--gold); }
  .cal-cell.sel .n { color: var(--on-gold); }
  .cal-dots { display: flex; gap: 3px; height: 4px; }
  .cal-dots i { width: 4px; height: 4px; border-radius: 50%; }

  /* ---- Stats ---- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card { background: var(--surface1); border-radius: 18px; padding: 18px; }
  .stat-value { font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif; font-weight: 800; font-size: 30px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 12.5px; color: var(--ivory-dim); margin-top: 4px; }
  .panel { background: var(--surface1); border-radius: 18px; padding: 18px; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; height: 100%; }
  .bar-count { font-size: 11px; color: var(--ivory-dim); }
  .bar { width: 100%; border-radius: 6px 6px 0 0; background: var(--gold); min-height: 3px; }
  .bar.zero { background: var(--hairline); }
  .bar-day { font-size: 11px; color: var(--ivory-faint); }
  .cat-row { margin-bottom: 14px; }
  .cat-row:last-child { margin-bottom: 0; }
  .cat-top { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .cat-top .count { margin-left: auto; font-weight: 400; font-size: 12.5px; color: var(--ivory-dim); }
  .cat-track { height: 5px; background: var(--hairline); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .cat-fill { height: 100%; border-radius: 3px; transition: width .4s ease; }

  .footer-space { height: 110px; }

  /* ---- Morning triage ---- */
  .triage { background: var(--surface1); border: 1px solid var(--gold-deep); border-radius: 16px; padding: 14px 16px; margin-top: 18px; }
  .triage-head { font-size: 10px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .tri-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--hairline); }
  .tri-row:last-child { border-bottom: none; padding-bottom: 2px; }
  .tri-title { flex: 1; font-size: 13.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tri-btn { flex: none; font-size: 11.5px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--hairline); background: none; color: var(--ivory-dim); cursor: pointer; font-family: inherit; }
  .tri-btn.gold { color: var(--gold); border-color: var(--gold-deep); }

  /* ---- Undo snackbar ---- */
  #snack {
    position: absolute; left: 16px; right: 16px; bottom: 86px; z-index: 30;
    background: var(--surface2); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 12px 16px; display: none; align-items: center; gap: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,.5);
  }
  #snack.open { display: flex; }
  #snack span { flex: 1; font-size: 13px; color: var(--ivory); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #snack button { background: none; border: none; color: var(--gold); font-weight: 600; font-family: inherit; font-size: 13px; cursor: pointer; }

  /* ---- Sub-tasks (editor) ---- */
  .sub-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .sub-row input[type=text] { flex: 1; padding: 9px 12px; }
  .sub-check { width: 19px; height: 19px; accent-color: var(--gold); flex: none; cursor: pointer; }
  .sub-del { background: none; border: none; color: var(--ivory-faint); cursor: pointer; font-size: 17px; padding: 2px 6px; }

  /* ---- Heatmap & habits ---- */
  .hm { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
  .hm i { width: 100%; aspect-ratio: 1; border-radius: 2.5px; background: var(--hairline); }
  .habit-dots { display: flex; gap: 3px; margin-top: 7px; }
  .habit-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--hairline); }
  .habit-dots i.hit { background: var(--gold); }
  .streak { font-size: 12.5px; color: var(--gold); font-weight: 600; white-space: nowrap; }

  /* ---- Vision ---- */
  select.msel {
    width: 100%; background: var(--ink); color: var(--ivory); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 13px; outline: none;
  }
  #visStatement {
    width: 100%; background: var(--ink); border: 1px solid var(--hairline); border-radius: 12px;
    color: var(--ivory); font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif; font-size: 16px; line-height: 1.6;
    padding: 14px; outline: none; resize: none; min-height: 84px;
  }
  #visStatement:focus { border-color: var(--gold); }
  .vis-count { font-size: 12.5px; color: var(--ivory-dim); }
  .data-btns { display: flex; gap: 10px; }
  .data-btn {
    flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--hairline);
    background: var(--surface1); color: var(--ivory-dim); font-family: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .data-btn:hover { color: var(--gold); border-color: var(--gold-deep); }

  /* ---- Week strip (Today screen top) ---- */
  .week-strip-wrap {
    background: var(--surface1);
    border-radius: 18px;
    padding: 14px 10px;
    margin: 16px 0 0;
  }
  .week-strip { display: flex; justify-content: space-between; }
  .ws-day {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 2px; border-radius: 14px; cursor: pointer; transition: background .15s;
  }
  .ws-day:hover { background: var(--surface2); }
  .ws-day.ws-today { background: var(--gold); }
  .ws-day.ws-past .ws-dow, .ws-day.ws-past .ws-num { opacity: .4; }
  .ws-dow {
    font-size: 10px; font-weight: 600; letter-spacing: .8px;
    text-transform: uppercase; color: var(--ivory-dim);
  }
  .ws-day.ws-today .ws-dow { color: var(--on-gold); opacity: 1; }
  .ws-num { font-size: 15px; font-weight: 700; color: var(--ivory); line-height: 1; font-variant-numeric: tabular-nums; }
  .ws-day.ws-today .ws-num { color: var(--on-gold); }
  .ws-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
  .ws-dot.ws-dot-empty { background: transparent; }
  .ws-day.ws-today .ws-dot { background: var(--on-gold); }

  /* ---- Today hero clock (Image 2 style) ---- */
  .today-hero { padding: 18px 0 6px; }
  .hero-date {
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 16px; font-weight: 300; color: var(--ivory-dim);
    letter-spacing: .3px; margin-bottom: 2px;
  }
  .hero-time {
    display: flex; align-items: flex-start; gap: 5px; line-height: 1;
  }
  .hero-hm {
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 74px; font-weight: 100; color: var(--ivory);
    letter-spacing: -3px; font-variant-numeric: tabular-nums; line-height: .92;
  }
  .hero-sec {
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 26px; font-weight: 200; color: var(--ivory-dim);
    font-variant-numeric: tabular-nums; margin-top: 10px; line-height: 1;
  }
  .hero-action-row {
    display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap;
  }

  /* ---- Research screen ---- */
  .rp-tile {
    background: var(--surface1); border-radius: 16px;
    margin-bottom: 12px; overflow: hidden;
  }
  .rp-tile.open { border: 1.5px solid var(--hairline); }
  .rp-tile-head {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 16px 16px 14px; cursor: pointer;
  }
  .rp-title-col { flex: 1; min-width: 0; }
  .rp-title { font-size: 16px; font-weight: 700; display: block; margin-bottom: 6px; }
  .rp-next { font-size: 12px; color: var(--ivory-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
  .rp-progress-track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .rp-progress-fill  { height: 100%; background: var(--gold); border-radius: 2px; transition: width .3s; }
  .rp-counts { display: flex; gap: 6px; flex: none; flex-direction: column; align-items: flex-end; }
  .rp-count {
    font-size: 11px; color: var(--ivory-faint); background: var(--surface2);
    border-radius: 8px; padding: 2px 8px;
  }
  .rp-chevron {
    font-size: 12px; color: var(--ivory-faint); transition: transform .2s; flex: none; margin-top: 2px;
  }
  .rp-tile.open .rp-chevron { transform: rotate(180deg); }
  .rp-body {
    display: none; padding: 0 14px 14px; border-top: 1px solid var(--hairline);
  }
  .rp-tile.open .rp-body { display: block; }
  .rp-section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--ivory-faint); margin: 14px 0 8px;
  }
  .rp-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--hairline);
  }
  .rp-item:last-child { border-bottom: none; }
  .rp-check {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--slate);
    display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer;
    font-size: 11px; color: transparent; background: none;
  }
  .rp-check.done { background: var(--sage); border-color: var(--sage); color: #fff; }
  .rp-item-text { flex: 1; font-size: 14px; }
  .rp-item-text.struck { text-decoration: line-through; color: var(--ivory-faint); }
  .rp-add-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 0 0;
  }
  .rp-add-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 7px 12px; color: var(--ivory); font-size: 14px;
    outline: none;
  }
  .rp-add-input:focus { border-color: var(--gold); }
  .rp-add-btn {
    font-size: 12px; font-weight: 600; color: var(--gold);
    background: none; border: none; cursor: pointer; padding: 4px;
  }
  .rp-notes-area {
    width: 100%; background: var(--surface2); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 10px 12px; color: var(--ivory); font-size: 14px;
    line-height: 1.5; resize: none; outline: none; min-height: 80px; font-family: inherit;
    box-sizing: border-box; margin-top: 8px;
  }
  .rp-notes-area:focus { border-color: var(--gold); }
  .rp-date-input {
    background: var(--surface2); border: 1px solid var(--hairline); border-radius: 8px;
    color: var(--ivory); font-size: 12px; font-family: inherit; padding: 6px 8px;
    outline: none; width: 120px; flex: none; cursor: pointer;
    color-scheme: dark;
  }
  .rp-date-input:focus { border-color: var(--gold); }
  .rp-target-date { font-size: 11px; color: var(--gold); flex: none; padding: 0 4px; }
  .rp-delete-btn {
    background: none; border: none; color: var(--ivory-faint); font-size: 13px;
    cursor: pointer; padding: 2px 6px;
  }
  .rp-rename-input {
    flex: 1; background: none; border: none; border-bottom: 1.5px solid var(--gold);
    color: var(--ivory); font-size: 15px; font-weight: 600; font-family: inherit;
    outline: none; padding: 2px 0; min-width: 0;
  }

  /* ---- Inline modal (replaces native prompt/confirm) ---- */
  #arcModalBg {
    display: none; position: absolute; inset: 0; z-index: 60;
    background: rgba(0,0,0,.7); align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  #arcModalBg.open { display: flex; }
  #arcModal {
    background: var(--surface2); border: 1px solid var(--hairline);
    border-radius: 18px; padding: 24px 20px 18px; width: calc(100% - 48px); max-width: 340px;
  }
  #arcModalMsg { font-size: 15px; font-weight: 600; margin-bottom: 14px; line-height: 1.4; white-space: pre-line; }
  #arcModalInput {
    width: 100%; background: var(--ink); border: 1px solid var(--hairline);
    border-radius: 10px; color: var(--ivory); font-size: 15px; padding: 11px 13px;
    outline: none; font-family: inherit; margin-bottom: 14px; box-sizing: border-box;
  }
  #arcModalInput:focus { border-color: var(--gold); }
  #arcModalBtns { display: flex; gap: 8px; justify-content: flex-end; }
  .arc-modal-btn {
    padding: 9px 18px; border-radius: 10px; border: none; font-size: 14px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .arc-modal-btn.primary { background: var(--gold); color: #fff; }
  .arc-modal-btn.secondary { background: var(--surface1); color: var(--ivory); }
  .arc-modal-btn.danger { background: var(--terracotta); color: #fff; }

  /* ---- Meeting overlay ---- */
  #meeting {
    position: absolute; inset: 0; z-index: 20; background: var(--ink);
    display: none; flex-direction: column; overflow-y: auto; scrollbar-width: none;
  }
  #meeting::-webkit-scrollbar { display: none; }
  #meeting.open { display: flex; }
  .meeting-head {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 48px 20px 20px;
    border-bottom: 1px solid var(--hairline);
  }
  .meeting-back {
    width: 36px; height: 36px; border-radius: 50%; background: var(--surface1);
    border: none; color: var(--ivory); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .meeting-title {
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 32px; font-weight: 200; color: var(--ivory); letter-spacing: -1px; flex: 1;
  }
  .meeting-close {
    width: 36px; height: 36px; border-radius: 50%; background: var(--surface1);
    border: none; color: var(--ivory-dim); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #meetingBody { padding: 0 20px calc(40px + env(safe-area-inset-bottom)); flex: 1; }
  .meeting-group-label {
    font-size: 10px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: var(--ivory-faint); margin: 22px 0 10px;
  }
  .meeting-task {
    display: flex; flex-direction: column;
    background: var(--surface1); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 8px;
  }
  .meeting-task:hover { background: var(--surface2); }
  .meeting-task-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .meeting-task-title { font-size: 15px; flex: 1; line-height: 1.35; }
  .meeting-task.done .meeting-task-title { color: var(--ivory-dim); }
  .meeting-task-edit {
    background: none; border: none; color: var(--ivory-faint);
    font-size: 15px; cursor: pointer; padding: 2px 4px; flex: none;
  }
  /* ---- Meeting task row controls ---- */
  .mt-row-head { display: flex; align-items: center; gap: 8px; }
  .mt-check {
    width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--slate);
    display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer;
    font-size: 11px; color: transparent; background: none;
  }
  .mt-check.done { background: var(--sage); border-color: var(--sage); color: #fff; }
  .mt-sub-count {
    font-size: 11px; color: var(--ivory-faint); margin-left: 5px;
    background: var(--surface2); border-radius: 6px; padding: 1px 6px;
  }
  .mt-exp-btn, .mt-del-btn {
    background: none; border: none; cursor: pointer; padding: 2px 4px; flex: none;
    font-size: 13px; color: var(--ivory-faint);
  }
  .mt-del-btn { color: var(--terracotta); }
  .mt-fb-btn {
    background: none; border: none; cursor: pointer; padding: 2px 4px; flex: none;
    font-size: 13px; color: var(--ivory-faint); opacity: 0.7;
  }
  .mt-fb-btn.has-note { color: var(--gold); opacity: 1; }
  .mt-feedback-area {
    margin: 10px 0 4px 0; display: flex; flex-direction: column; gap: 6px;
  }
  .mt-feedback-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--gold);
    border-radius: 10px; padding: 10px 12px; color: var(--ivory); font-size: 13px;
    font-family: inherit; resize: none; min-height: 44px; outline: none;
    box-sizing: border-box; line-height: 1.5; overflow: hidden;
    field-sizing: content;
  }
  .mt-feedback-existing {
    margin: 6px 0 0 0; font-size: 12px; color: var(--ivory-faint);
    font-style: italic; line-height: 1.5; padding: 0 2px;
  }
  .mt-feedback-save {
    align-self: flex-end; padding: 6px 18px; background: var(--gold);
    color: #fff; border: none; border-radius: 8px; font-size: 12px;
    font-weight: 600; cursor: pointer; letter-spacing: .3px;
  }
  .mt-subs { margin: 8px 0 4px 30px; border-left: 1px solid var(--hairline); padding-left: 10px; }
  .mt-sub-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--hairline); }
  .mt-sub-row:last-child { border-bottom: none; }
  .mt-sub-check {
    width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--slate);
    display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer;
    font-size: 10px; color: transparent;
  }
  .mt-sub-check.done { background: var(--sage); border-color: var(--sage); color: #fff; }
  .mt-sub-text { flex: 1; font-size: 13px; }
  .mt-sub-text.struck { text-decoration: line-through; color: var(--ivory-faint); }
  .mt-sub-del { background: none; border: none; cursor: pointer; color: var(--ivory-faint); font-size: 12px; padding: 0 2px; }
  .mt-sub-add-row { padding: 6px 0 0; }
  .mt-sub-input, .mt-add-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 7px 10px; color: var(--ivory); font-size: 13px;
    outline: none; font-family: inherit;
  }
  .mt-sub-input:focus, .mt-add-input:focus { border-color: var(--gold); }
  .mt-add-row {
    display: flex; gap: 6px; margin: 10px 20px 0; padding-bottom: 4px;
  }
  .mt-add-input { flex: 1; font-size: 14px; }
  .mt-add-go {
    background: var(--gold); border: none; border-radius: 8px; color: #fff;
    font-size: 18px; font-weight: 700; cursor: pointer; padding: 0 14px;
  }
  .meeting-toggle {
    display: flex; background: var(--surface1); border-radius: 10px;
    padding: 3px; gap: 2px;
  }
  .meeting-toggle-btn {
    flex: 1; padding: 7px 0; border: none; border-radius: 8px; cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: .4px;
    background: none; color: var(--ivory-faint); transition: all .15s;
  }
  .meeting-toggle-btn.active { background: var(--gold); color: #fff; }

  /* ---- Sub-task retro progress bar ---- */
  .retro-bar { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .retro-segs {
    display: flex; gap: 2px; flex: 1; height: 22px;
  }
  .retro-inline-label {
    flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
  }
  .retro-pct {
    font-size: 13px; font-weight: 700; color: var(--ivory);
    font-family: 'Courier New', 'Courier', monospace;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .retro-label {
    font-size: 10px; font-weight: 500; color: var(--ivory-faint);
    font-family: 'Courier New', 'Courier', monospace; letter-spacing: .3px;
  }
  .retro-seg {
    flex: 1; border-radius: 1px; background: #333333;
  }
  .retro-seg.on { background: var(--gold); }

  /* ---- Habit strip (repeating tasks) ---- */
  .habit-strip {
    margin-top: 10px; padding: 8px 10px;
    background: var(--surface2); border-radius: 12px;
  }
  .habit-streak-label {
    font-size: 11px; font-weight: 600; letter-spacing: .3px;
    color: var(--ivory-dim); margin-bottom: 8px;
  }
  .habit-week { display: flex; justify-content: space-between; }
  .habit-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .habit-dow {
    font-size: 9px; font-weight: 600; letter-spacing: .5px;
    text-transform: uppercase; color: var(--ivory-faint);
  }
  .habit-circle {
    width: 22px; height: 22px; border-radius: 50%; background: var(--hairline);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: transparent;
  }
  .habit-circle.done { background: var(--sage); color: #fff; }
  .habit-circle.cur { background: transparent; border: 2px solid var(--sage); color: transparent; }
  .habit-circle.miss { background: var(--hairline); opacity: .35; }
  .habit-circle.fut { background: var(--hairline); opacity: .18; }

  /* ---- Inline subtask expansion ---- */
  .task-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .task-edit-btn {
    flex: none; background: none; border: none; color: var(--ivory-faint);
    font-size: 15px; cursor: pointer; padding: 1px 4px; line-height: 1;
    transition: color .15s; border-radius: 6px;
  }
  .task-edit-btn:hover { color: var(--gold); }
  .task-row.is-expanded { border: 1.5px solid var(--gold) !important; }
  .sub-inline-list { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hairline); }
  .sub-inline-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--hairline);
  }
  .sub-inline-row:last-of-type { border-bottom: none; }
  .sub-inline-check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--slate); flex: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12px; color: transparent; transition: all .15s;
  }
  .sub-inline-check.done { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
  .sub-inline-text { flex: 1; font-size: 14px; color: var(--ivory); line-height: 1.35; }
  .sub-inline-text.struck { text-decoration: line-through; color: var(--ivory-faint); }
  .sub-inline-add {
    display: block; width: 100%; margin-top: 8px; padding: 7px 0;
    background: none; border: none; border-top: 1px dashed var(--hairline);
    color: var(--gold); font-family: inherit; font-size: 13px;
    font-weight: 600; cursor: pointer; text-align: left;
  }
  .sub-inline-input {
    width: 100%; margin: 6px 0; padding: 9px 12px;
    background: var(--ink); border: 1px solid var(--gold);
    border-radius: 10px; color: var(--ivory);
    font-family: inherit; font-size: 14px; outline: none;
  }

  /* ---- Morning brief ---- */
  .brief-launch {
    margin-top: 18px; padding: 10px 18px; border-radius: 24px;
    background: none; border: 1px solid var(--gold-deep); color: var(--gold);
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; transition: all .15s;
  }
  .brief-launch:hover { background: rgba(212,180,118,.08); }
  #brief {
    position: absolute; inset: 0; z-index: 20; background: rgba(8,9,12,.97);
    display: none; flex-direction: column; align-items: center;
    padding: 32px 28px calc(28px + env(safe-area-inset-bottom)); text-align: center;
  }
  #brief.open { display: flex; }
  .brief-prefs { display: flex; gap: 8px; }
  #voicePanel {
    display: none; width: 100%; margin-top: 14px; background: var(--surface1);
    border: 1px solid var(--hairline); border-radius: 14px; padding: 14px; text-align: left;
  }
  #voicePanel.open { display: block; }
  #voiceSel {
    width: 100%; background: var(--ink); color: var(--ivory); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 13px; outline: none;
  }
  .voice-hint { font-size: 11.5px; color: var(--ivory-faint); margin-top: 10px; line-height: 1.5; }
  .brief-orb {
    width: 90px; height: 90px; border-radius: 50%; border: 1px solid var(--gold-deep);
    display: flex; align-items: center; justify-content: center; margin: 44px 0 26px; flex: none;
  }
  .brief-orb::after {
    content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--gold);
    animation: pulse 1.9s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.8); opacity: .4 } }
  #briefSection { font-size: 11px; font-weight: 500; letter-spacing: 1.6px; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
  #briefText {
    color: var(--ivory-dim); font-size: 14.5px; line-height: 1.65;
    overflow-y: auto; scrollbar-width: none; max-height: 42vh;
  }
  #briefText::-webkit-scrollbar { display: none; }
  .brief-btns { margin-top: auto; display: flex; gap: 12px; width: 100%; padding-top: 20px; }
  .brief-btn {
    flex: 1; padding: 14px; border-radius: 14px; font-family: inherit;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .brief-btn.ghost { background: none; border: 1px solid var(--hairline); color: var(--ivory-dim); }
  .brief-btn.ghost:hover { border-color: var(--gold-deep); color: var(--gold); }
  .brief-btn.solid { background: var(--gold); border: none; color: var(--on-gold); }

  /* ---- Update banner ---- */
  #updateBanner {
    position: absolute; top: 0; left: 0; right: 0; z-index: 99;
    background: var(--gold); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; font-size: 13px; font-weight: 500;
    transform: translateY(-110%); transition: transform .3s cubic-bezier(.3,.7,.3,1);
  }
  #updateBanner.show { transform: translateY(0); }
  #updateBanner button {
    background: rgba(255,255,255,.25); border: none; border-radius: 8px;
    color: #fff; font-size: 12px; font-weight: 600; padding: 5px 12px; cursor: pointer;
  }

  /* ---- Calendar sync modal ---- */
  #calOverlay {
    position: absolute; inset: 0; background: rgba(0,0,0,.6);
    z-index: 20; opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  #calOverlay.open { opacity: 1; pointer-events: auto; }
  #calSheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--surface1); border-radius: 24px 24px 0 0;
    padding: 12px 24px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s cubic-bezier(.3,.7,.3,1);
    max-height: 88%; overflow-y: auto; scrollbar-width: none;
  }
  #calSheet::-webkit-scrollbar { display: none; }
  #calSheet.open { transform: translateY(0); }
  .cal-email-row { display:flex; align-items:center; gap:8px; background:var(--surface2); border-radius:12px; padding:9px 12px; margin-bottom:12px; border:1px solid var(--hairline); }
  .cal-email-input { flex:1; background:none; border:none; outline:none; color:var(--ivory); font-size:13px; font-family:inherit; min-width:0; }
  .cal-email-input::placeholder { color:var(--ivory-faint); }
  .cal-email-sync { background:var(--gold); border:none; color:#fff; border-radius:7px; padding:3px 8px; font-size:13px; cursor:pointer; flex:none; }
  .cal-days-row { display: flex; gap: 8px; margin-top: 4px; }
  .cal-days-btn {
    flex: 1; padding: 9px 0; border: 1.5px solid var(--hairline); border-radius: 10px;
    background: none; color: var(--ivory-dim); font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .cal-days-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(255,85,0,.08); }
  #calEventsList { margin-top: 14px; }
  .cal-event-item {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--surface2); border-radius: 12px;
    padding: 11px 13px; margin-bottom: 8px; cursor: pointer;
  }
  .cal-event-item input[type=checkbox] { flex: none; margin-top: 2px; accent-color: var(--gold); width:17px; height:17px; }
  .cal-event-body { flex: 1; min-width: 0; }
  .cal-event-title { font-size: 14px; font-weight: 500; line-height: 1.3; }
  .cal-event-meta { font-size: 12px; color: var(--ivory-dim); margin-top: 3px; }
  .cal-event-desc { font-size: 12px; color: var(--ivory-faint); margin-top: 4px; white-space: pre-wrap; line-height: 1.4; }
  .cal-status { text-align: center; color: var(--ivory-dim); font-size: 13px; padding: 20px 0; }
  .cal-already { color: var(--ivory-faint); font-size: 12px; font-style: italic; margin-top: 3px; }
  .cal-btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .cal-import-btn {
    flex: 1; padding: 14px; border: none; border-radius: 14px;
    background: var(--gold); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity .15s;
  }
  .cal-import-btn:disabled { opacity: .35; cursor: default; }
  .cal-selall-btn {
    padding: 14px 18px; border: 1.5px solid var(--hairline); border-radius: 14px;
    background: none; color: var(--ivory); font-size: 14px; cursor: pointer;
  }

  /* ---- Sync status dot ---- */
  .sync-dot { width:8px; height:8px; border-radius:50%; background:var(--ivory-faint); position:absolute; top:14px; right:20px; z-index:5; transition:background .3s; }
  .sync-dot.syncing { background:var(--gold); animation:sync-pulse 1s infinite; }
  .sync-dot.ok { background:var(--sage); }
  .sync-dot.error { background:var(--terracotta); }
  @keyframes sync-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ---- Search overlay ---- */
  .search-overlay { display:none; position:absolute; inset:0; z-index:30; background:var(--ink); flex-direction:column; padding:16px 20px; }
  .search-overlay.open { display:flex; }
  .search-top { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .search-input { flex:1; background:var(--surface2); border:1px solid var(--hairline); border-radius:12px; color:var(--ivory); font-size:15px; padding:12px 14px; outline:none; font-family:inherit; }
  .search-input:focus { border-color:var(--gold); }
  .search-cancel { background:none; border:none; color:var(--gold); font-size:14px; cursor:pointer; padding:8px 0; white-space:nowrap; font-family:inherit; }
  .search-results { flex:1; overflow-y:auto; scrollbar-width:none; }
  .search-results::-webkit-scrollbar { display:none; }

  /* ---- Quick reschedule menu ---- */
  .quick-sched { display:none; position:fixed; z-index:25; background:var(--surface2); border:1px solid var(--hairline); border-radius:14px; padding:6px; flex-direction:column; gap:4px; box-shadow:0 8px 32px rgba(0,0,0,.5); min-width:160px; }
  .qs-btn { background:none; border:none; color:var(--ivory); font-size:14px; padding:10px 14px; border-radius:10px; cursor:pointer; text-align:left; font-family:inherit; }
  .qs-btn:hover { background:var(--surface1); }
  .qs-btn.danger { color:var(--terracotta); }

  /* ---- Now & Next widget ---- */
  .nnw-card {
    background: linear-gradient(135deg, rgba(255,85,0,.10) 0%, rgba(255,85,0,.03) 100%);
    border: 1px solid rgba(255,85,0,.28);
    border-radius: 18px; padding: 14px 16px; margin-bottom: 12px;
    display: grid; grid-template-columns: 1fr 1px 1fr; gap: 12px; align-items: center;
  }
  .nnw-col { min-width: 0; }
  .nnw-label {
    font-size: 9px; font-weight: 700; letter-spacing: 1.8px; color: var(--gold);
    text-transform: uppercase; display: block; margin-bottom: 5px;
  }
  .nnw-name {
    font-size: 13px; font-weight: 600; color: var(--ivory);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    line-height: 1.35;
  }
  .nnw-sub { font-size: 11px; color: var(--ivory-dim); margin-top: 3px; display: block; }
  .nnw-countdown { font-size: 11px; font-weight: 700; color: var(--gold); margin-top: 3px; display: block; }

</style>

  { id: 'today',    label: 'Today',    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>' },
  { id: 'tasks',    label: 'Tasks',    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6.5h9M4 12h9M4 17.5h9M16.5 6.5l1.7 1.7 3.3-3.4M16.5 12l1.7 1.7 3.3-3.4M16.5 17.5l1.7 1.7 3.3-3.4"/></svg>' },
  { id: 'calendar', label: 'Calendar', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17M8 2.8v4M16 2.8v4"/></svg>' },
  { id: 'vision',   label: 'Vision',   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>' },
  { id: 'stats',    label: 'Progress', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V13M10 20V4M16 20v-9M21 20H3"/></svg>' },
  { id: 'research', label: 'Research', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/><path d="M11 8v6M8 11h6"/></svg>' },
];
const nav = document.getElementById('nav');
nav.innerHTML = NAV.map(n =>
  `<div class="nav-item ${screen===n.id?'on':''}" data-s="${n.id}">${n.icon}<span>${n.label}</span></div>`).join('');
nav.addEventListener('click', e => {
  const item = e.target.closest('.nav-item'); if (!item) return;
  screen = item.dataset.s;
  nav.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('on', el.dataset.s === screen));
  document.getElementById('fab').style.display = screen === 'stats' ? 'none' : 'flex';
  if (screen !== 'research') expandedProjectId = null;
  render();
});

function render() {
  try {
    if (screen === 'today') renderToday();
    else if (screen === 'tasks') renderTasks();
    else if (screen === 'calendar') renderCalendar();
    else if (screen === 'vision') renderVision();
    else if (screen === 'research') renderResearch();
    else renderStats();
  } catch (err) {
    const view = document.getElementById('view');
    if (view) view.innerHTML = `<div style="padding:20px 16px">
      <div style="font-size:15px;font-weight:700;color:var(--gold);margin-bottom:12px">Render error — please report this</div>
      <pre style="font-size:11px;color:var(--ivory-faint);white-space:pre-wrap;word-break:break-all">${esc(String(err?.stack || err))}</pre>
      <button onclick="render()" style="margin-top:12px;padding:8px 16px;background:var(--gold);color:#000;border:none;border-radius:8px;font-weight:600;cursor:pointer">Retry</button>
    </div>`;
    console.error('render() crashed:', err);
  }
}

/* ================= Reminders (while app is open) ================= */
function checkReminders() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const today = todayStr();
  for (const t of tasks) {
    if (t.done || !t.reminder || t.notifiedAt) continue;
    const fireDate = t.reminderDate || t.due;
    if (fireDate !== today) continue;
    const [h, m] = t.reminder.split(':').map(Number);
    if (nowMin >= h * 60 + m) {
      const dueNote = t.reminderDate && t.due && t.reminderDate !== t.due ? ` · Due ${t.due}` : '';
      new Notification(t.title, { body: pri(t.priority).label + ' · ' + cat(t.category).label + dueNote, tag: 'meridian-' + t.id });
      t.notifiedAt = Date.now();
      save();
    }
  }
}
setInterval(checkReminders, 20000);
checkReminders();

/* 6:00 AM daily nudge (while the app is open): tap it to hear the brief.
   The Android app will fire this reliably even when closed. */
function morningNudge() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  if (now.getHours() !== 6) return;
  if (localStorage.getItem('meridian.morningNotif') === todayStr()) return;
  localStorage.setItem('meridian.morningNotif', todayStr());
  const n = new Notification('Good morning ☀', {
    body: 'Here is how your day looks today. Tap to hear your morning brief.',
    tag: 'meridian-morning'
  });
  n.onclick = () => { window.focus(); n.close(); startBrief(); };
}
setInterval(morningNudge, 30000);
morningNudge();

/* 21:00 wind-down: close today's loop, preview tomorrow's first block */
function eveningNudge() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  if (now.getHours() !== 21) return;
  if (localStorage.getItem('meridian.eveNotif') === todayStr()) return;
  localStorage.setItem('meridian.eveNotif', todayStr());
  const plan = planDay(todayStr());
  const total = new Set(plan.blocks.filter(b => !b.lunch).map(b => b.task.id)).size + plan.overflow.length + plan.completed.length;
  const d = new Date(); d.setDate(d.getDate() + 1);
  const tplan = planDay(toDateStr(d));
  let body = 'You completed ' + plan.completed.length + ' of ' + total + ' today.';
  const firstTomorrow = tplan.blocks.find(b => !b.lunch);
  if (firstTomorrow) {
    const b = firstTomorrow;
    body += ' Tomorrow starts with "' + b.task.title + '" at ' +
      fmtTime(Math.floor(b.start / 60), b.start % 60) + '.';
  }
  const n = new Notification('Winding down 🌙', { body, tag: 'meridian-evening' });
  n.onclick = () => { window.focus(); n.close(); };
}
setInterval(eveningNudge, 30000);
eveningNudge();

/* ================= Calendar Sync ================= */
let calFetchedEvents = [];
let calDays = 7;
const calImported = new Set(JSON.parse(localStorage.getItem('arc.calImported') || '[]'));

const calOverlay  = document.getElementById('calOverlay');
const calSheet    = document.getElementById('calSheet');
const calClose    = document.getElementById('calCloseBtn');
const calFetchBtn = document.getElementById('calFetchBtn');
const calImportRow= document.getElementById('calImportRow');
const calImportBtn= document.getElementById('calImportBtn');
const calSelAllBtn= document.getElementById('calSelAllBtn');
const calEmailIn  = document.getElementById('calEmailInput');
const calList     = document.getElementById('calEventsList');

function openCalSheet() {
  calEmailIn.value = prefs.calendarEmail || '';
  calList.innerHTML = '';
  calImportRow.style.display = 'none';
  calFetchedEvents = [];
  calOverlay.classList.add('open');
  calSheet.classList.add('open');
}
function closeCalSheet() {
  calOverlay.classList.remove('open');
  calSheet.classList.remove('open');
}

calOverlay.addEventListener('click', closeCalSheet);
calClose.addEventListener('click', closeCalSheet);

document.querySelectorAll('.cal-days-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cal-days-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    calDays = parseInt(btn.dataset.days);
  });
});

calFetchBtn.addEventListener('click', async () => {
  const email = calEmailIn.value.trim();
  if (!email) { calList.innerHTML = '<div class="cal-status">Enter a calendar email first.</div>'; return; }
  if (!SHEET_URL) { calList.innerHTML = '<div class="cal-status">Set up SHEET_URL first (see setup instructions).</div>'; return; }
  prefs.calendarEmail = email;
  savePrefs();
  calFetchBtn.disabled = true;
  calFetchBtn.textContent = 'Fetching…';
  calList.innerHTML = '<div class="cal-status">Loading events…</div>';
  calImportRow.style.display = 'none';
  try {
    const url = `${SHEET_URL}?action=calendar&email=${encodeURIComponent(email)}&days=${calDays}&t=${Date.now()}`;
    const res = await fetch(url);
    const d = await res.json();
    if (d.error) {
      const needsAccess = /not found|permission|does not have access|not.*shared|cannot access/i.test(d.error);
      calList.innerHTML = `<div class="cal-status" style="color:var(--terracotta)">${esc(d.error)}</div>` +
        (needsAccess ? `<button class="btn-primary" id="calRequestAccess" style="margin-top:12px;width:100%">📨 Send access request to ${esc(email)}</button>` : '');
      if (needsAccess) {
        document.getElementById('calRequestAccess').addEventListener('click', async () => {
          const btn = document.getElementById('calRequestAccess');
          btn.disabled = true; btn.textContent = 'Sending…';
          try {
            const r = await fetch(`${SHEET_URL}?action=requestAccess&email=${encodeURIComponent(email)}&t=${Date.now()}`);
            const rd = await r.json();
            if (rd.ok) {
              calList.innerHTML = `<div class="cal-status" style="color:#4CAF50">✓ Access request sent to ${esc(email)}.<br>Once they share their calendar with <strong>${esc(rd.scriptEmail||'your Apps Script account')}</strong>, sync will work automatically.</div>`;
            } else {
              btn.disabled = false; btn.textContent = '📨 Send access request';
              calList.insertAdjacentHTML('beforeend', `<div class="cal-status" style="color:var(--terracotta)">${esc(rd.error)}</div>`);
            }
          } catch(ex) {
            btn.disabled = false; btn.textContent = '📨 Send access request';
          }
        });
      }
      return;
    }
    calFetchedEvents = d.events || [];
    renderCalEvents();
  } catch (e) {
    calList.innerHTML = '<div class="cal-status" style="color:var(--terracotta)">Failed to fetch. Check your SHEET_URL and network.</div>';
  } finally {
    calFetchBtn.disabled = false;
    calFetchBtn.textContent = 'Fetch events';
  }
});

function renderCalEvents() {
  if (!calFetchedEvents.length) {
    calList.innerHTML = '<div class="cal-status">No upcoming events found.</div>';
    calImportRow.style.display = 'none';
    return;
  }
  let html = '';
  calFetchedEvents.forEach((ev, i) => {
    const already = calImported.has(ev.id);
    const start = new Date(ev.start);
    const end   = new Date(ev.end);
    const dateStr = start.toLocaleDateString('en-IN', { weekday:'short', month:'short', day:'numeric' });
    const timeStr = ev.allDay ? 'All day' : (
      start.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' }) +
      ' – ' + end.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' })
    );
    const desc = ev.description ? `<div class="cal-event-desc">${esc(ev.description.slice(0,120))}${ev.description.length>120?'…':''}</div>` : '';
    const loc  = ev.location ? `<span>📍 ${esc(ev.location)}</span>` : '';
    html += `<label class="cal-event-item">
      <input type="checkbox" data-idx="${i}"${already ? ' disabled' : ' checked'}>
      <div class="cal-event-body">
        <div class="cal-event-title">${esc(ev.title)}</div>
        <div class="cal-event-meta">${dateStr} · ${timeStr} ${loc}</div>
        ${already ? '<div class="cal-already">Already imported</div>' : desc}
      </div>
    </label>`;
  });
  calList.innerHTML = html;
  calImportRow.style.display = 'flex';
  updateImportBtn();
  calList.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', updateImportBtn));
}

function updateImportBtn() {
  const n = calList.querySelectorAll('input[type=checkbox]:not(:disabled):checked').length;
  calImportBtn.textContent = n ? `Import ${n} event${n>1?'s':''}` : 'Import selected';
  calImportBtn.disabled = n === 0;
}

calSelAllBtn.addEventListener('click', () => {
  const boxes = calList.querySelectorAll('input[type=checkbox]:not(:disabled)');
  const allChecked = [...boxes].every(b => b.checked);
  boxes.forEach(b => b.checked = !allChecked);
  updateImportBtn();
});

calImportBtn.addEventListener('click', () => {
  const newTasks = [];
  calList.querySelectorAll('input[type=checkbox]:not(:disabled):checked').forEach(cb => {
    const ev = calFetchedEvents[parseInt(cb.dataset.idx)];
    if (!ev) return;
    const start = new Date(ev.start);
    const dueDate = toDateStr(start);
    let timeVal = null;
    if (!ev.allDay) {
      const h = start.getHours(), m = start.getMinutes();
      timeVal = fmtTime(h, m);
    }
    const end = new Date(ev.end);
    const durMin = Math.round((end - start) / 60000);
    newTasks.push({
      id: uid(), title: ev.title, category: calImportCat, priority: 'medium',
      due: dueDate, time: timeVal,
      duration: (!ev.allDay && durMin > 0 && durMin < 480) ? durMin : 60,
      notes: [ev.description, ev.location ? `Location: ${ev.location}` : ''].filter(Boolean).join('\n').trim(),
      done: false, repeat: null, inProgress: false, meetingNote: '',
      calendarEventId: ev.id
    });
    calImported.add(ev.id);
  });
  if (!newTasks.length) return;
  tasks.push(...newTasks);
  localStorage.setItem('arc.calImported', JSON.stringify([...calImported]));
  save();
  render();
  closeCalSheet();
  showUndo(`${newTasks.length} calendar event${newTasks.length>1?'s':''} added`, null);
});

document.addEventListener('click', e => {
  if (e.target.id === 'calSyncBtn') openCalSheet();
});

/* ---- Evening wrap-up ---- */
function eveningWrap() {
  const now = new Date();
  if (now.getHours() !== 21 || now.getMinutes() > 15) return;
  if (localStorage.getItem('arc.wrapDone') === todayStr()) return;
  const incomplete = tasks.filter(t => t.due === todayStr() && !t.done);
  if (!incomplete.length) return;
  localStorage.setItem('arc.wrapDone', todayStr());
  arcModal({
    message: `Day wrap: ${incomplete.length} task${incomplete.length!==1?'s':''} unfinished today.\nRoll them all to tomorrow?`,
    buttons: [
      { label: 'Roll to tomorrow', type: 'primary', value: true },
      { label: 'Leave them', type: 'secondary', value: false }
    ]
  }).then(ok => {
    if (!ok) return;
    const tom = offsetDate(todayStr(), 1);
    incomplete.forEach(t => { t.due = tom; t.updatedAt = Date.now(); });
    save(); render();
    showUndo(`${incomplete.length} task${incomplete.length!==1?'s':''} moved to tomorrow`, null);
  });
}
setInterval(eveningWrap, 60000);
eveningWrap();

/* ---- Search input listeners ---- */
document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { document.getElementById('searchResults').innerHTML = ''; return; }
  const hits = tasks.filter(t => t.title.toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q)).slice(0,30);
  document.getElementById('searchResults').innerHTML = hits.length
    ? hits.map(t => taskRowHTML(t, t.time || '')).join('')
    : `<p style="color:var(--ivory-dim);text-align:center;padding:30px 0">No tasks match "${esc(e.target.value)}"</p>`;
  document.getElementById('searchResults').querySelectorAll('.task-row').forEach(row => {
    row.addEventListener('click', () => {
      const t = tasks.find(x => x.id === row.dataset.id);
      if (t) { closeSearch(); openEditor(t); }
    });
  });
});
document.getElementById('searchCancel').addEventListener('click', closeSearch);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSearch(); });

/* ---- Quick reschedule long-press ---- */
document.getElementById('view').addEventListener('pointerdown', e => {
  const row = e.target.closest('.task-row');
  if (!row || !row.dataset.id) return;
  qsLongTimer = setTimeout(() => {
    showQuickSched(row.dataset.id, e.clientY - 20, e.clientX - 80);
  }, 500);
});
document.getElementById('view').addEventListener('pointerup', () => clearTimeout(qsLongTimer));
document.getElementById('view').addEventListener('pointermove', () => clearTimeout(qsLongTimer));

document.getElementById('quickSched').addEventListener('click', e => {
  const btn = e.target.closest('[data-qs]');
  if (!btn || !qsTaskId) { hideQuickSched(); return; }
  const t = tasks.find(x => x.id === qsTaskId);
  if (!t) { hideQuickSched(); return; }
  const action = btn.dataset.qs;
  if (action === 'today') { t.due = todayStr(); t.updatedAt = Date.now(); save(); render(); }
  else if (action === 'tomorrow') { t.due = offsetDate(todayStr(), 1); t.updatedAt = Date.now(); save(); render(); }
  else if (action === 'nextweek') { t.due = offsetDate(todayStr(), 7); t.updatedAt = Date.now(); save(); render(); }
  else if (action === 'drop') {
    arcModal({ message: `Drop "${t.title}"? It will be deleted.`, buttons: [{label:'Cancel',type:'secondary',value:false},{label:'Drop it',type:'danger',value:true}] })
      .then(ok => { if(ok) { tasks = tasks.filter(x=>x.id!==t.id); save(); render(); } });
  }
  hideQuickSched();
});
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#quickSched')) hideQuickSched();
});

/* ---- Calendar category picker ---- */
let calImportCat = 'WORK';
document.getElementById('calCatRow').addEventListener('click', e => {
  const btn = e.target.closest('[data-cat]');
  if (!btn) return;
  document.querySelectorAll('#calCatRow .cal-days-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

});

/* ---- Sheet URL input (in voice panel) ---- */
document.getElementById('sheetUrlInput').value = SHEET_URL;
document.getElementById('sheetUrlInput').addEventListener('change', e => {
  SHEET_URL = e.target.value.trim();
  localStorage.setItem('arc.sheetUrl', SHEET_URL);
});

/* ── Auto-update checker ─────────────────────────────────────────────────── */
(async function checkVersion() {
  try {
    const res = await fetch('version.json?t=' + Date.now());
    const { v } = await res.json();
    const stored = localStorage.getItem('arc.version');
    // Always store the new version first — so if user reloads, stored === v and banner won't reappear
    localStorage.setItem('arc.version', v);
    if (stored && stored !== v) {
      document.getElementById('updateBanner').classList.add('show');
    }
  } catch (_) {}
  setTimeout(checkVersion, 5 * 60 * 1000);
})();
/* ─────────────────────────────────────────────────────────────────────────── */

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if (!sw) return;
      sw.addEventListener('statechange', () => {
        if (sw.state === 'activated') location.reload();
      });
    });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type === 'SW_UPDATED') location.reload();
  });
}

/* ── Back-button / Hardware back (Android PWA) ───────────────────────────── */
(function initBackNav() {
  const ROOT = 'today';
  let backPressedOnce = false, backExitTimer = null;

  // Seed history so the very first popstate fires correctly
  history.replaceState({ screen: screen, layer: 0 }, '', location.href);

  // Push a history entry whenever the screen changes
  function navPush(s) {
    history.pushState({ screen: s, layer: 1 }, '', location.href);
  }
  function navPushModal(name) {
    history.pushState({ modal: name, layer: 2 }, '', location.href);
  }

  // Intercept nav-bar clicks to push history
  const origNavClick = nav.onclick;
  nav.addEventListener('click', e => {
    const item = e.target.closest('.nav-item');
    if (item && item.dataset.s !== screen) navPush(item.dataset.s);
  }, true); // capture phase — runs before the existing handler

  // Intercept openEditor / openMeeting / openCalSheet / startBrief / openSearch
  // to push a modal history entry each time a sheet opens
  const _openEditor   = openEditor;
  window.openEditor = function(task) {
    navPushModal('editor'); _openEditor(task);
  };
  const _openMeeting  = openMeeting;
  window.openMeeting = function() {
    navPushModal('meeting'); _openMeeting();
  };
  const _openCalSheet = openCalSheet;
  window.openCalSheet = function() {
    navPushModal('calSheet'); _openCalSheet();
  };
  const _startBrief   = startBrief;
  window.startBrief = function() {
    navPushModal('brief'); _startBrief();
  };
  const _openSearch   = openSearch;
  window.openSearch = function() {
    navPushModal('search'); _openSearch();
  };

  // When X/overlay closes a sheet manually, pop its history entry too
  function patchClose(closeFn, modalName) {
    return function(...args) {
      closeFn(...args);
      if (history.state && history.state.modal === modalName) history.back();
    };
  }
  overlay.removeEventListener('click', closeEditor);
  const _closeEditor = closeEditor;
  window.closeEditor = patchClose(_closeEditor, 'editor');
  overlay.addEventListener('click', closeEditor);

  window.closeMeeting = patchClose(closeMeeting, 'meeting');
  window.closeCalSheet = patchClose(closeCalSheet, 'calSheet');
  window.closeSearch = patchClose(closeSearch, 'search');
  // Patch endBrief so closing the brief also pops its history entry
  const _endBrief = endBrief;
  window.endBrief = function() {
    _endBrief();
    if (history.state && history.state.modal === 'brief') history.back();
  };

  // Central popstate handler
  window.addEventListener('popstate', async e => {
    const s = e.state || { layer: 0 };

    // ── Close open modals (highest layer first) ──────────────────────────
    if (document.getElementById('searchOverlay').classList.contains('open')) {
      closeSearch(); return;
    }
    if (sheet.classList.contains('open')) {
      const titleEl = sheet.querySelector('#fTitle');
      const dirty   = titleEl && titleEl.value.trim().length > 0 && !editingId;
      if (dirty) {
        history.pushState({ modal: 'editor', layer: 2 }, '', location.href);
        const discard = await arcModal({
          message: 'You have an unsaved task. Discard it?',
          buttons: [
            { label: 'Keep editing', type: 'secondary', value: false },
            { label: 'Discard', type: 'danger', value: true }
          ]
        });
        if (!discard) return;
        history.back();
      }
      _closeEditor(); return;
    }
    if (document.getElementById('calSheet').classList.contains('open')) {
      closeCalSheet(); return;
    }
    if (document.getElementById('meeting').classList.contains('open')) {
      closeMeeting(); return;
    }
    if (briefEl.classList.contains('open')) {
      endBrief(); return;
    }

    // ── Screen navigation ────────────────────────────────────────────────
    if (s.layer === 1 && s.screen && s.screen !== screen) {
      screen = s.screen;
      nav.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('on', el.dataset.s === screen));
      document.getElementById('fab').style.display = screen === 'stats' ? 'none' : 'flex';
      render();
      return;
    }

    // ── At root (Today) — double-back to exit ────────────────────────────
    if (backPressedOnce) {
      // Second back within 2 s — let the browser/OS handle exit naturally
      history.back();
      return;
    }
    backPressedOnce = true;
    showUndo('Press back again to exit', null);
    clearTimeout(backExitTimer);
    backExitTimer = setTimeout(() => { backPressedOnce = false; }, 2000);
    // Re-push root so the next back triggers this handler again
    history.pushState({ screen: ROOT, layer: 0 }, '', location.href);
  });
})();

pullFromSheet();
scheduleNotifications();
updateAppBadge();

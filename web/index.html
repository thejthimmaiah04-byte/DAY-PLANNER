<script>
'use strict';

/* ================= Data ================= */
const CATEGORIES = [
  { id: 'WORK',     label: 'Work',          color: 'var(--gold)' },
  { id: 'VISION',   label: '2-Year Vision', color: 'var(--terracotta)' },
  { id: 'SKILL',    label: 'Skill Building',color: 'var(--sage)' },
  { id: 'PERSONAL', label: 'Personal',      color: 'var(--slate)' },
];
const PRIORITIES = [
  { id: 'URGENT', label: 'Urgent', weight: 4, color: 'var(--terracotta)' },
  { id: 'HIGH',   label: 'High',   weight: 3, color: 'var(--gold)' },
  { id: 'MEDIUM', label: 'Medium', weight: 2, color: 'var(--sage)' },
  { id: 'LOW',    label: 'Low',    weight: 1, color: 'var(--slate)' },
];
const REPEATS = [
  { id: '',        label: 'Never' },
  { id: 'DAILY',   label: 'Daily' },
  { id: 'WEEKLY',  label: 'Weekly' },
  { id: 'MONTHLY', label: 'Monthly' },
  { id: 'YEARLY',  label: 'Yearly' },
];
const cat = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
const pri = id => PRIORITIES.find(p => p.id === id) || PRIORITIES[2];

let tasks = JSON.parse(localStorage.getItem('meridian.tasks') || '[]');

// Prune completed repeating tasks older than 90 days into arc.archive to cap storage growth
function pruneOldCompletedRepeats() {
  const cutoff = toDateStr(new Date(Date.now() - 90 * 86400000));
  const archive = JSON.parse(localStorage.getItem('arc.archive') || '[]');
  const pruned = tasks.filter(t => t.done && t.repeat && t.due && t.due < cutoff);
  if (!pruned.length) return;
  tasks = tasks.filter(t => !(t.done && t.repeat && t.due && t.due < cutoff));
  try { localStorage.setItem('arc.archive', JSON.stringify([...archive, ...pruned])); } catch {}
}
pruneOldCompletedRepeats();

// ── Google Sheets sync ──────────────────────────────────────────────────────
// Migrate hardcoded URL to localStorage on first run, then read from localStorage
// so it can be changed via settings without a code push
(function() {
  const EMBEDDED = 'https://script.google.com/macros/s/AKfycbx-cJEh9Hd8nvkHrw0TKATqnc-3vfWhXZNn0Ec2fgemwhfq4Jx8I7PvdjCdvp0oc--3/exec';
  if (!localStorage.getItem('arc.sheetUrl') && EMBEDDED) localStorage.setItem('arc.sheetUrl', EMBEDDED);
})();
let SHEET_URL = localStorage.getItem('arc.sheetUrl') || '';

let _syncStatusTimer = null;
function setSyncStatus(s) {
  const dot = document.getElementById('syncDot');
  if (dot) dot.className = 'sync-dot ' + s;
  clearTimeout(_syncStatusTimer);
  if (s === 'ok' || s === 'error') _syncStatusTimer = setTimeout(() => setSyncStatus('idle'), 3000);
}

function pushToSheet() {
  if (!SHEET_URL) return;
  setSyncStatus('syncing');
  const payload = JSON.stringify({
    tasks,
    vision,
    research,
    meta: {
      prefs: typeof prefs !== 'undefined' ? prefs : {},
      archive: JSON.parse(localStorage.getItem('arc.archive') || '[]'),
      syncedAt: new Date().toISOString()
    }
  });
  fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', body: payload })
    .then(() => setSyncStatus('ok'))
    .catch(() => setSyncStatus('error'));
}

function mergeTasks(local, remote) {
  const map = new Map();
  for (const t of remote) map.set(t.id, t);
  for (const t of local) {
    const r = map.get(t.id);
    if (!r || (t.updatedAt || 0) >= (r.updatedAt || 0)) map.set(t.id, t);
  }
  return [...map.values()];
}

async function pullFromSheet() {
  if (!SHEET_URL) return;
  setSyncStatus('syncing');
  try {
    const res = await fetch(SHEET_URL + '?t=' + Date.now());
    const d = await res.json();

    // Pull guard: warn if remote task count is suspiciously low
    const remoteTasks = Array.isArray(d.tasks) ? d.tasks : [];
    const localCount = tasks.length;
    if (localCount > 3 && remoteTasks.length < localCount * 0.6 && remoteTasks.length < localCount - 3) {
      const ok = await arcModal({
        message: `Cloud has ${remoteTasks.length} task${remoteTasks.length!==1?'s':''}, your device has ${localCount}. Merge both safely?`,
        buttons: [
          { label: 'Merge (safe)', type: 'primary', value: true },
          { label: 'Keep mine', type: 'secondary', value: false }
        ]
      });
      if (!ok) { setSyncStatus('idle'); return; }
    }

    let changed = false;
    if (remoteTasks.length || localCount === 0) {
      tasks = mergeTasks(tasks, remoteTasks);
      localStorage.setItem('meridian.tasks', JSON.stringify(tasks));
      changed = true;
    }
    if (d.vision && Object.keys(d.vision).length) {
      vision = Object.assign({ statement: '', target: '', milestones: [] }, d.vision);
      localStorage.setItem('meridian.vision', JSON.stringify(vision)); changed = true;
    }
    if (Array.isArray(d.research)) {
      research = d.research; localStorage.setItem('arc.research', JSON.stringify(research)); changed = true;
    }
    if (d.meta) {
      if (d.meta.prefs && typeof prefs !== 'undefined') {
        Object.assign(prefs, d.meta.prefs); localStorage.setItem('meridian.prefs', JSON.stringify(prefs));
      }
      if (d.meta.archive) localStorage.setItem('arc.archive', JSON.stringify(d.meta.archive));
    } else {
      // Backward compat: old format had prefs at top level
      if (d.prefs && typeof prefs !== 'undefined') {
        Object.assign(prefs, d.prefs); localStorage.setItem('meridian.prefs', JSON.stringify(prefs));
      }
      if (d.archive) localStorage.setItem('arc.archive', JSON.stringify(d.archive));
    }
    setSyncStatus('ok');
    if (changed) render();
  } catch (_) { setSyncStatus('error'); }
}
// ────────────────────────────────────────────────────────────────────────────

const save = () => { localStorage.setItem('meridian.tasks', JSON.stringify(tasks)); pushToSheet(); scheduleNotifications(); updateAppBadge(); };

let vision = Object.assign({ statement: '', target: '', milestones: [] },
  JSON.parse(localStorage.getItem('meridian.vision') || '{}'));
const saveVision = () => { localStorage.setItem('meridian.vision', JSON.stringify(vision)); pushToSheet(); };

let research = JSON.parse(localStorage.getItem('arc.research') || '[]');
const saveResearch = () => { localStorage.setItem('arc.research', JSON.stringify(research)); pushToSheet(); };
let expandedProjectId = null;
let expandedRpTaskId = null;
let meetingMode = 'work';
let meetingFeedbackId = null;

const milestoneProgress = ms => {
  const linked = tasks.filter(t => t.milestoneId === ms.id);
  if (!linked.length) return ms.done ? 1 : 0;
  return linked.filter(t => t.done).length / linked.length;
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

/* ================= Date helpers ================= */
const todayStr = () => toDateStr(new Date());
function toDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function offsetDate(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return toDateStr(d);
}
function fromDateStr(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function nextDueDate(dateStr, repeat) {
  const [y, m, d] = dateStr.split('-').map(Number);
  if (repeat === 'DAILY')  { const dt = new Date(y, m-1, d+1); return toDateStr(dt); }
  if (repeat === 'WEEKLY') { const dt = new Date(y, m-1, d+7); return toDateStr(dt); }
  if (repeat === 'MONTHLY') {
    let ny = y, nm = m + 1; if (nm > 12) { nm = 1; ny++; }
    const clamp = Math.min(d, new Date(ny, nm, 0).getDate());
    return toDateStr(new Date(ny, nm-1, clamp));
  }
  if (repeat === 'YEARLY') {
    const clamp = Math.min(d, new Date(y+1, m, 0).getDate());
    return toDateStr(new Date(y+1, m-1, clamp));
  }
  return null;
}
function fmtDate(s, opts) { return fromDateStr(s).toLocaleDateString('en-US', opts); }
function fmtTime(h, m) {
  const am = h < 12; let hh = h % 12; if (hh === 0) hh = 12;
  return hh + ':' + String(m).padStart(2,'0') + (am ? ' AM' : ' PM');
}

/* ================= State ================= */
let screen = 'today';
let selectedDate = todayStr();
let calMonth = todayStr().slice(0, 7);          // 'YYYY-MM'
let taskFilter = null;
let editingId = null;
let expandedTaskId = null;

/* ================= Day planner =================
   Work tasks are scheduled only inside the work window (9:00–17:00).
   Everything else (vision, skills, personal) gets the morning slot
   before work and the evening after it. */
const DAY_START = 8 * 60, DAY_END = 22 * 60;
const WORK_START = 9 * 60, WORK_END = 17 * 60;
const LUNCH_START = 13 * 60, LUNCH_END = 14 * 60;

function planDay(dateStr) {
  const isToday = dateStr === todayStr();
  const dayTasks = tasks.filter(t => t.due === dateStr);
  const completed = dayTasks.filter(t => t.done);
  const pending = dayTasks.filter(t => !t.done);
  // Overdue tasks go to morning triage instead of silently flooding today
  const triage = isToday
    ? tasks.filter(t => t.due && t.due < dateStr && !t.done)
        .sort((a, b) => pri(b.priority).weight - pri(a.priority).weight)
    : [];

  let nowCursor = 0;
  if (isToday) {
    const now = new Date();
    nowCursor = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 15) * 15;
  }

  const blocks = [], overflow = [], busy = [[LUNCH_START, LUNCH_END]];
  // Fixed-time appointments anchor first; everything else flows around them
  const fixed = pending.filter(t => t.fixedTime);
  const flex = pending.filter(t => !t.fixedTime);
  for (const t of fixed) {
    const [h, m] = t.fixedTime.split(':').map(Number);
    const start = h * 60 + m, end = start + Math.max(15, t.estimate || 30);
    blocks.push({ task: t, start, end, fixed: true });
    busy.push([start - 5, end + 5]);
  }
  busy.sort((a, b) => a[0] - b[0]);

  // Carve category windows: clamp to "now", subtract fixed appointments
  const carve = spans => {
    let wins = spans.map(([s, e]) => [Math.max(s, nowCursor), e]).filter(([s, e]) => s < e);
    for (const [bs, be] of busy) {
      const next = [];
      for (const [s, e] of wins) {
        if (be <= s || bs >= e) { next.push([s, e]); continue; }
        if (bs > s) next.push([s, bs]);
        if (be < e) next.push([be, e]);
      }
      wins = next;
    }
    return wins.map(([s, e]) => ({ cur: s, end: e }));
  };

  const byRank = list => list.sort((a, b) =>
    pri(b.priority).weight - pri(a.priority).weight || a.estimate - b.estimate);

  const fill = (list, windows) => {
    for (const t of list) {
      const total = Math.max(15, t.estimate || 30);
      // Long tasks split into <=55-minute focus parts with 10-minute breaks
      const parts = total > 60 ? Math.ceil(total / 55) : 1;
      const per = Math.ceil(total / parts);
      const placed = [];
      for (let p = 0; p < parts; p++) {
        const win = windows.find(w => w.cur + per <= w.end);
        if (!win) break;
        placed.push({ start: win.cur, end: win.cur + per });
        win.cur += per + (parts > 1 ? 10 : 5);
      }
      if (placed.length < parts) { overflow.push(t); continue; }
      placed.forEach((pp, i) => blocks.push({
        task: t, start: pp.start, end: pp.end,
        part: parts > 1 ? (i + 1) + '/' + parts : null
      }));
    }
  };
  fill(byRank(flex.filter(t => t.category === 'WORK')), carve([[WORK_START, WORK_END]]));
  fill(byRank(flex.filter(t => t.category !== 'WORK')),
       carve([[DAY_START, WORK_START], [WORK_END, DAY_END]]));

  // Always inject the lunch break as a sentinel so the UI can show it
  blocks.push({ lunch: true, start: LUNCH_START, end: LUNCH_END });
  blocks.sort((a, b) => a.start - b.start);
  overflow.sort((a, b) => pri(b.priority).weight - pri(a.priority).weight);
  return { blocks, overflow, completed, triage };
}

/* ================= Rendering ================= */
const view = document.getElementById('view');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let clockInterval = null;
function startLiveClock() {
  clearInterval(clockInterval);
  function tick() {
    const now = new Date();
    const hm = document.getElementById('liveHM');
    const sec = document.getElementById('liveSec');
    const dateEl = document.getElementById('liveDate');
    if (!hm) { clearInterval(clockInterval); return; }
    hm.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    if (sec) sec.textContent = String(now.getSeconds()).padStart(2,'0');
    if (dateEl) dateEl.textContent = now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric' });
  }
  tick();
  clockInterval = setInterval(tick, 1000);
}

function habitWeekData(t) {
  if (!t.repeat) return null;
  const seriesId = t.seriesId || t.id;
  const series = tasks.filter(x => (x.seriesId || x.id) === seriesId);
  const today = new Date();
  const todayDow = (today.getDay() + 6) % 7;
  const weekStatus = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - todayDow + i);
    const ds = toDateStr(d);
    const task = series.find(x => x.due === ds);
    weekStatus.push({ date: ds, done: task ? task.done : false, hasTask: !!task });
  }
  let streak = 0;
  const sortedPast = series
    .filter(x => x.due && x.due <= todayStr())
    .sort((a, b) => b.due.localeCompare(a.due));
  for (const x of sortedPast) {
    if (x.due === todayStr() && !x.done && streak === 0) continue;
    if (x.done) streak++; else break;
  }
  return { weekStatus, streak };
}

function taskRowHTML(t, timeLabel, part) {
  const p = pri(t.priority);
  const subsDone = (t.subs && t.subs.length) ? t.subs.filter(s => s.done).length : 0;
  const subsTotal = (t.subs && t.subs.length) ? t.subs.length : 0;
  const subsPct = subsTotal ? Math.round(subsDone / subsTotal * 100) : 0;
  const isExpanded = expandedTaskId === t.id;

  // Collapsed sub-task progress bar (only when not expanded)
  let progressHTML = '';
  if (subsTotal > 0 && !isExpanded) {
    const SEGS = 28;
    const filled = Math.round(subsPct / 100 * SEGS);
    const segs = Array.from({length: SEGS}, (_, i) =>
      `<div class="retro-seg${i < filled ? ' on' : ''}"></div>`).join('');
    progressHTML = `<div class="retro-bar">
      <div class="retro-segs">${segs}</div>
      <div class="retro-inline-label">
        <span class="retro-pct">${subsPct}<span style="font-size:9px;font-weight:400;opacity:0.5;letter-spacing:0;vertical-align:super;margin-left:1px">%</span></span>
        <span class="retro-label">${subsDone}/${subsTotal}</span>
      </div>
    </div>`;
  }

  // Inline expanded subtask list
  let subtasksHTML = '';
  if (isExpanded) {
    const rows = (t.subs || []).map((s, i) => `
      <div class="sub-inline-row" data-subtick="${t.id}" data-idx="${i}">
        <div class="sub-inline-check ${s.done ? 'done' : ''}">✓</div>
        <span class="sub-inline-text ${s.done ? 'struck' : ''}">${esc(s.text)}</span>
      </div>`).join('');
    subtasksHTML = `<div class="sub-inline-list">
      ${rows}
      <button class="sub-inline-add" data-addstep="${t.id}">+ Add step</button>
    </div>`;
  }

  // Habit strip for repeating tasks
  let habitHTML = '';
  if (t.repeat) {
    const hw = habitWeekData(t);
    if (hw) {
      const todayDow = (new Date().getDay() + 6) % 7;
      const DOW_L = ['M','T','W','T','F','S','S'];
      const dots = DOW_L.map((lbl, i) => {
        const s = hw.weekStatus[i];
        const cls = s.done ? 'done' : i === todayDow ? 'cur' : i < todayDow ? 'miss' : 'fut';
        return `<div class="habit-day"><span class="habit-dow">${lbl}</span><div class="habit-circle ${cls}">${s.done ? '✓' : ''}</div></div>`;
      }).join('');
      habitHTML = `<div class="habit-strip">
        <div class="habit-streak-label">🔥 ${hw.streak} day streak · ↻ ${(REPEATS.find(r => r.id === t.repeat) || REPEATS[1]).label}</div>
        <div class="habit-week">${dots}</div>
      </div>`;
    }
  }

  return `
    <div class="task-row ${t.done ? 'is-done' : ''}${isExpanded ? ' is-expanded' : ''}" data-id="${t.id}">
      <div class="check ${t.done ? 'done' : ''}" style="border-color:${t.done ? '' : p.color}" data-toggle="${t.id}">✓</div>
      <div class="task-main" data-expand="${t.id}">
        <div class="task-title-row">
          <div class="task-title">${esc(t.title)}</div>
          <button class="task-edit-btn" data-edit="${t.id}" title="Edit">✎</button>
        </div>
        <div class="task-meta">
          <span class="pdot" style="background:${p.color}"></span>
          ${p.label} · ${cat(t.category).label} · ${t.estimate}m
          ${!t.done ? `<button class="task-start-btn ${focusTaskId===t.id?'active':''}" onclick="event.stopPropagation();startFocus('${t.id}',${t.estimate||25})">▶ ${t.estimate||25}m</button>` : ''}
        </div>
        ${progressHTML}
        ${subtasksHTML}
        ${habitHTML}
      </div>
      ${timeLabel ? `<div class="task-time">${timeLabel}${part ? '<br><span style="color:var(--ivory-faint);font-weight:500">pt ${part}</span>' : ''}</div>` : ''}
    </div>`;
}

function emptyHTML(title, sub) {
  return `<div class="empty"><div class="empty-orb"></div><h3>${title}</h3><p>${sub}</p></div>`;
}

function retroBar(pct, label) {
  const SEGS = 28;
  const filled = Math.round(pct / 100 * SEGS);
  const segs = Array.from({length: SEGS}, (_, i) =>
    `<div class="retro-seg${i < filled ? ' on' : ''}"></div>`).join('');
  return `<div class="retro-bar" style="margin-top:0">
    <div class="retro-segs" style="height:28px">${segs}</div>
    <div class="retro-inline-label">
      <span class="retro-pct">${pct}<span style="font-size:9px;font-weight:400;opacity:0.5;letter-spacing:0;vertical-align:super;margin-left:1px">%</span></span>
      ${label ? `<span class="retro-label">${label}</span>` : ''}
    </div>
  </div>`;
}

/* ---- Focus timer ---- */
let focusTaskId = null, focusSeconds = 0, focusInterval = null;

function startFocus(taskId, minutes) {
  clearInterval(focusInterval);
  focusTaskId = taskId;
  focusSeconds = (minutes || 25) * 60;
  focusInterval = setInterval(() => {
    if (focusSeconds <= 0) {
      clearInterval(focusInterval);
      focusTaskId = null;
      if (Notification.permission === 'granted') new Notification('Focus session done! Take a break.', { tag: 'arc-focus' });
      render(); return;
    }
    focusSeconds--;
    const el = document.getElementById('focusTime');
    if (el) {
      const m = Math.floor(focusSeconds/60), s = focusSeconds%60;
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
  }, 1000);
  render();
}
function stopFocus() { clearInterval(focusInterval); focusTaskId = null; focusSeconds = 0; render(); }
function focusBarHTML() {
  if (!focusTaskId) return '';
  const t = tasks.find(x=>x.id===focusTaskId);
  if (!t) return '';
  const m = Math.floor(focusSeconds/60), s = focusSeconds%60;
  return `<div class="focus-bar">
    <div class="focus-task-title">${esc(t.title)}</div>
    <div class="focus-time" id="focusTime">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>
    <button class="focus-stop" onclick="stopFocus()">Stop</button>
  </div>`;
}

/* ---- Now & Next widget ---- */
function nowNextWidget() {
  const plan = planDay(todayStr());
  if (!plan.blocks.length) return '';
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const cur  = plan.blocks.find(b => !b.lunch && b.start <= nowMin && b.end > nowMin && !b.task.done);
  const next = plan.blocks.find(b => !b.lunch && b.start > nowMin && !b.task.done);
  if (!cur && !next) return '';

  function col(block, label) {
    if (!block) return `<div class="nnw-col"><span class="nnw-label">${label}</span><span class="nnw-free">Free</span></div>`;
    const sh = Math.floor(block.start/60), sm = block.start%60;
    const eh = Math.floor(block.end/60),   em = block.end%60;
    return `<div class="nnw-col">
      <span class="nnw-label">${label}</span>
      <span class="nnw-name">${esc(block.task.title)}</span>
      <span class="nnw-sub">${fmtTime(sh,sm)} – ${fmtTime(eh,em)}</span>
    </div>`;
  }
  function countdown(block) {
    if (!block) return '';
    const diff = block.start - nowMin;
    return diff < 60 ? `in ${diff}m` : `in ${Math.floor(diff/60)}h ${diff%60 ? diff%60+'m' : ''}`.trim();
  }

  const nextCol = next ? `<div class="nnw-col">
    <span class="nnw-label">Next</span>
    <span class="nnw-name">${esc(next.task.title)}</span>
    <span class="nnw-countdown">${countdown(next)}</span>
  </div>` : `<div class="nnw-col"><span class="nnw-label">Next</span><span class="nnw-free">You're free</span></div>`;

  return `<div class="nnw-card">${col(cur,'Now')}<div class="nnw-divider"></div>${nextCol}</div>`;
}

/* ---- Notification scheduling (lock-screen reminders) ---- */
let _notifTimers = [];
function scheduleNotifications() {
  _notifTimers.forEach(clearTimeout);
  _notifTimers = [];
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const today = todayStr(), now = Date.now();
  tasks.filter(t => t.due === today && !t.done && t.fixedTime).forEach(t => {
    const [h, m] = t.fixedTime.split(':').map(Number);
    const startMs = new Date().setHours(h, m, 0, 0);
    [{ delay: startMs - 10*60*1000 - now, msg: `Coming up in 10 min`, sub: `${t.title} • ${fmtTime(h,m)}` },
     { delay: startMs - now,              msg: `Starting now`,        sub: t.title }]
    .filter(n => n.delay > 0)
    .forEach(n => _notifTimers.push(setTimeout(() => {
      new Notification(n.msg, { body: n.sub, icon: 'icon-192.png', tag: 'arc-'+t.id, silent: false });
    }, n.delay)));
  });
}

function updateAppBadge() {
  const count = tasks.filter(t => t.due === todayStr() && !t.done).length;
  if ('setAppBadge' in navigator) navigator.setAppBadge(count || 0).catch(()=>{});
}

function notifPermBar() {
  if (!('Notification' in window) || Notification.permission !== 'default') return '';
  const hasTimed = tasks.some(t => t.due === todayStr() && t.fixedTime && !t.done);
  if (!hasTimed) return '';
  return `<div class="nnw-notif-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    Enable notifications to get reminders for today's scheduled tasks.
    <button onclick="Notification.requestPermission().then(p=>{if(p==='granted'){scheduleNotifications();}render()})">Enable</button>
  </div>`;
}

/* ---- Today ---- */
function renderToday() {
  const plan = planDay(todayStr());
  const plannedCount = new Set(plan.blocks.filter(b => !b.lunch).map(b => b.task.id)).size;
  const total = plannedCount + plan.overflow.length + plan.completed.length;
  const pct = total ? Math.round(plan.completed.length / total * 100) : 0;

  // Week strip
  const now = new Date();
  const todayDow = (now.getDay() + 6) % 7;
  const DOW = ['M','T','W','T','F','S','S'];
  let weekHtml = '';
  for (let i = 0; i < 7; i++) {
    const dt = new Date(now);
    dt.setDate(now.getDate() - todayDow + i);
    const ds = toDateStr(dt);
    const hasTasks = tasks.some(t => t.due === ds);
    const isToday = i === todayDow;
    const isPast = i < todayDow;
    weekHtml += `<div class="ws-day${isToday ? ' ws-today' : isPast ? ' ws-past' : ''}" data-date="${ds}">
      <span class="ws-dow">${DOW[i]}</span>
      <span class="ws-num">${dt.getDate()}</span>
      <span class="ws-dot${hasTasks ? '' : ' ws-dot-empty'}"></span>
    </div>`;
  }

  let html = `
    <div class="week-strip-wrap"><div class="week-strip">${weekHtml}</div></div>
    <div class="today-hero">
      <div class="hero-date" id="liveDate"></div>
      <div class="hero-time">
        <span class="hero-hm" id="liveHM"></span>
        <span class="hero-sec" id="liveSec"></span>
      </div>
      <div class="hero-action-row">
        <button type="button" class="brief-launch" id="briefBtn" style="margin:0">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v10M12 13a4 4 0 0 0 4-4M12 13a4 4 0 0 1-4-4" transform="translate(0,2)"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5" /></svg>
          Morning brief
        </button>
        <button type="button" class="brief-launch" id="meetingBtn" style="margin:0;background:var(--surface2);color:var(--ivory)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3l-4 4-4-4"/></svg>
          Meeting
        </button>
        <button type="button" class="brief-launch hero-icon-btn" id="searchBtn" style="margin:0;background:var(--surface2);color:var(--ivory);padding:0 14px" title="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
      </div>
    </div>
    ${nowNextWidget()}
    ${notifPermBar()}
    ${focusBarHTML()}
    ${total > 0 ? retroBar(pct, `${plan.completed.length} of ${total} done`) : '<p style="color:var(--ivory-faint);font-size:13px;padding:4px 0 8px">Ready when you are.</p>'}`;

  if (plan.triage.length) {
    html += `<div class="triage">
      <div class="triage-head">Slipped from earlier — decide their fate</div>
      ${plan.triage.map(t => `
        <div class="tri-row">
          <span class="tri-title">${esc(t.title)}</span>
          <button type="button" class="tri-btn gold" data-tri="today" data-id="${t.id}">Today</button>
          <button type="button" class="tri-btn" data-tri="tmr" data-id="${t.id}">Tomorrow</button>
          <button type="button" class="tri-btn" data-tri="drop" data-id="${t.id}">Drop</button>
        </div>`).join('')}
    </div>`;
  }

  if (!total && !plan.triage.length) html += emptyHTML('A clear day', 'Add tasks and ARC will plan your day.');

  if (plan.blocks.length) {
    html += `<div class="section-label">Your plan</div>`;
    for (const b of plan.blocks) {
      if (b.lunch) {
        html += `<div class="lunch-break-row"><span class="lunch-icon">🍽</span><span class="lunch-label">Lunch</span><span class="lunch-time">1:00 – 2:00 PM</span></div>`;
      } else {
        try {
          html += taskRowHTML(b.task, fmtTime(Math.floor(b.start/60), b.start%60), b.part);
        } catch(e) {
          console.error('taskRowHTML failed for', b.task?.title, e);
          html += `<div style="padding:8px 12px;color:var(--terracotta);font-size:12px">⚠ Could not render: ${esc(b.task?.title||'task')}</div>`;
        }
      }
    }
  }
  if (plan.overflow.length) {
    html += `<div class="section-label">Didn't fit today</div>`;
    for (const t of plan.overflow) { try { html += taskRowHTML(t); } catch(e) { console.error('taskRowHTML overflow', e); } }
  }
  if (plan.completed.length) {
    html += `<div class="section-label">Completed</div>`;
    for (const t of plan.completed) { try { html += taskRowHTML(t); } catch(e) { console.error('taskRowHTML completed', e); } }
  }
  html += `<div class="footer-space"></div>`;
  view.innerHTML = html;

  startLiveClock();

  view.querySelectorAll('.ws-day').forEach(el =>
    el.addEventListener('click', () => {
      selectedDate = el.dataset.date;
      screen = 'calendar';
      nav.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('on', n.dataset.s === 'calendar'));
      document.getElementById('fab').style.display = 'flex';
      renderCalendar();
    }));
}

/* ---- Tasks ---- */
let taskSearch = '';
function taskListHTML() {
  const q = taskSearch.trim().toLowerCase();
  const filtered = tasks.filter(t =>
    (!taskFilter || t.category === taskFilter) &&
    (!q || t.title.toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q)));
  const pending = filtered.filter(t => !t.done).sort((a,b) =>
    pri(b.priority).weight - pri(a.priority).weight || (a.due||'9999').localeCompare(b.due||'9999'));
  const done = filtered.filter(t => t.done).sort((a,b) => (b.completedAt||0) - (a.completedAt||0));

  let html = '';
  if (!pending.length && !done.length)
    html += q ? emptyHTML('No matches', 'Try a different search.')
              : emptyHTML('Nothing here yet', 'Capture work, goals and skills to build your path.');
  if (pending.length) {
    html += `<div class="section-label">Pending</div>`;
    for (const t of pending) {
      const dueLabel = t.due ? (t.due === todayStr() ? 'Today' : fmtDate(t.due, {month:'short', day:'numeric'})) : '';
      html += taskRowHTML(t, dueLabel);
    }
  }
  if (done.length) {
    html += `<div class="section-label">Done</div>`;
    for (const t of done) html += taskRowHTML(t);
  }
  return html + `<div class="footer-space"></div>`;
}
function renderTasks() {
  view.innerHTML = `<div class="screen-title">All tasks</div>
  <input type="text" id="taskSearch" placeholder="Search tasks…" value="${esc(taskSearch)}" style="margin-bottom:12px">
  <div class="chip-row">
    <button type="button" class="chip ${!taskFilter ? 'on':''}" data-filter="">All</button>
    ${CATEGORIES.map(c => `<button type="button" class="chip ${taskFilter===c.id?'on':''}" data-filter="${c.id}">${c.label}</button>`).join('')}
  </div>
  <div id="taskListWrap">${taskListHTML()}</div>`;

  document.getElementById('taskSearch').addEventListener('input', e => {
    taskSearch = e.target.value;
    document.getElementById('taskListWrap').innerHTML = taskListHTML();
  });
  view.querySelectorAll('[data-filter]').forEach(el =>
    el.addEventListener('click', () => { taskFilter = el.dataset.filter || null; renderTasks(); }));
}

/* ---- Calendar ---- */
function renderCalendar() {
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDow = (first.getDay() + 6) % 7;          // Monday = 0
  const monthName = first.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  const byDay = {};
  for (const t of tasks) if (t.due) (byDay[t.due] = byDay[t.due] || []).push(t);

  // ── Multi-day span bars ──────────────────────────────────────────────────
  const SPAN_PALETTE = ['#ef4444','#3b82f6','#22c55e','#a855f7','#f59e0b','#06b6d4','#f97316','#ec4899'];
  const multiDay = tasks.filter(t => t.startDate && t.due && t.startDate < t.due);
  const sortedMulti = [...multiDay].sort((a, b) => a.startDate.localeCompare(b.startDate));
  const spanMeta = {};
  const laneEnds = [];
  sortedMulti.forEach((t, i) => {
    let lane = laneEnds.findIndex(e => t.startDate > e);
    if (lane === -1) { lane = laneEnds.length; laneEnds.push(t.due); }
    else laneEnds[lane] = t.due;
    spanMeta[t.id] = { color: SPAN_PALETTE[i % SPAN_PALETTE.length], lane };
  });

  const monthStartStr = calMonth + '-01';
  const monthEndStr   = calMonth + '-' + String(daysInMonth).padStart(2, '0');

  // Build per-day bar data (avoids CSS grid explicit/auto-placement conflict)
  const spansByDay = {};
  for (const t of sortedMulti) {
    const meta = spanMeta[t.id];
    const vS = t.startDate < monthStartStr ? monthStartStr : t.startDate;
    const vE = t.due > monthEndStr ? monthEndStr : t.due;
    if (vS > monthEndStr || vE < monthStartStr) continue;
    const sd2 = parseInt(vS.slice(8)), ed2 = parseInt(vE.slice(8));
    for (let day = sd2; day <= ed2; day++) {
      const ds2 = calMonth + '-' + String(day).padStart(2, '0');
      if (!spansByDay[ds2]) spansByDay[ds2] = [];
      spansByDay[ds2].push({
        color: meta.color,
        lane: meta.lane,
        isStart: ds2 === t.startDate || (t.startDate < monthStartStr && day === sd2),
        isEnd:   ds2 === t.due       || (t.due > monthEndStr         && day === ed2),
        title: t.title
      });
    }
  }

  const calEmail = prefs.calendarEmail || '';
  let html = `<div class="cal-head">
      <div class="screen-title">${monthName}</div>
      <button class="cal-nav" id="calPrev">‹</button>
      <button class="cal-nav" id="calNext">›</button>
      <button class="cal-nav" id="calSyncBtn" title="Sync from Google Calendar" style="font-size:16px;padding:0 6px;">⟳</button>
    </div>
    <div class="cal-email-row" id="calEmailRow">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;opacity:.55"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
      <input type="email" id="calEmailInline" class="cal-email-input" placeholder="Set calendar email…" value="${esc(calEmail)}" autocomplete="email">
      ${calEmail ? `<button class="cal-email-sync" id="calEmailSyncNow" title="Sync now">⟳</button>` : ''}
    </div>
    <div class="cal-grid">
      ${['M','T','W','T','F','S','S'].map(d => `<div class="cal-dow">${d}</div>`).join('')}`;

  for (let i = 0; i < firstDow; i++) html += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = calMonth + '-' + String(d).padStart(2,'0');
    const cls = (ds === selectedDate ? 'sel' : ds === todayStr() ? 'today' : '');
    const dots = (byDay[ds] || []).slice(0, 3)
      .map(t => `<i style="background:${ds === selectedDate ? 'var(--on-gold)' : pri(t.priority).color}"></i>`).join('');
    const spansHere = (spansByDay[ds] || []).slice().sort((a, b) => a.lane - b.lane);
    const barsHtml = spansHere.map(s => {
      const rL = s.isStart ? '3px' : '0';
      const rR = s.isEnd   ? '3px' : '0';
      return `<div class="cal-bar-inner" style="background:${s.color};border-radius:${rL} ${rR} ${rR} ${rL}" title="${esc(s.title)}"></div>`;
    }).join('');
    html += `<div class="cal-cell-outer" data-date="${ds}">`;
    html += `<div class="cal-cell ${cls}"><span class="n">${d}</span><span class="cal-dots">${dots}</span></div>`;
    if (spansHere.length) html += `<div class="cal-bar-slot">${barsHtml}</div>`;
    html += `</div>`;
  }
  html += `</div>`;

  const dayTasks = tasks.filter(t =>
    t.due === selectedDate ||
    (t.startDate && t.startDate <= selectedDate && t.due >= selectedDate)
  ).sort((a,b) => (a.done - b.done) || pri(b.priority).weight - pri(a.priority).weight);
  html += `<div class="section-label">${fmtDate(selectedDate, {weekday:'long', month:'long', day:'numeric'})}</div>`;
  if (!dayTasks.length)
    html += `<p style="color:var(--ivory-dim);font-size:13px;padding:10px 0 4px">Nothing scheduled. Tap + to plan this day.</p>`;
  for (const t of dayTasks) {
    const timeLabel = t.fixedTime ? fmtTime(...t.fixedTime.split(':').map(Number)) : '';
    html += taskRowHTML(t, timeLabel);
  }
  html += `<div class="footer-space"></div>`;
  view.innerHTML = html;

  document.getElementById('calPrev').onclick = () => { shiftMonth(-1); };
  document.getElementById('calNext').onclick = () => { shiftMonth(1); };
  view.querySelectorAll('.cal-cell-outer[data-date]').forEach(el =>
    el.addEventListener('click', () => { selectedDate = el.dataset.date; renderCalendar(); }));

  const inlineEmail = document.getElementById('calEmailInline');
  if (inlineEmail) {
    inlineEmail.addEventListener('change', () => {
      prefs.calendarEmail = inlineEmail.value.trim();
      savePrefs();
      renderCalendar();
    });
    inlineEmail.addEventListener('keydown', e => {
      if (e.key === 'Enter') { inlineEmail.blur(); }
    });
  }
  const syncNow = document.getElementById('calEmailSyncNow');
  if (syncNow) {
    syncNow.onclick = () => openCalSheet();
  }
}
function shiftMonth(delta) {
  let [y, m] = calMonth.split('-').map(Number);
  m += delta; if (m === 0) { m = 12; y--; } if (m === 13) { m = 1; y++; }
  calMonth = y + '-' + String(m).padStart(2,'0');
  renderCalendar();
}

/* ---- Stats ---- */
function habitStats() {
  const bySeries = {};
  for (const t of tasks) {
    if (!t.repeat) continue;
    const k = t.seriesId || (t.title + '|' + t.repeat);
    (bySeries[k] = bySeries[k] || []).push(t);
  }
  return Object.values(bySeries).map(list => {
    list.sort((a, b) => (a.due || '').localeCompare(b.due || ''));
    const past = list.filter(t => t.due && t.due <= todayStr());
    let streak = 0;
    for (let i = past.length - 1; i >= 0; i--) {
      const t = past[i];
      if (t.due === todayStr() && !t.done && streak === 0) continue; // today isn't over yet
      if (t.done) streak++; else break;
    }
    return {
      title: list[list.length - 1].title,
      repeat: (REPEATS.find(r => r.id === list[0].repeat) || REPEATS[1]).label,
      streak,
      recent: past.slice(-14)
    };
  }).sort((a, b) => b.streak - a.streak);
}

function renderStats() {
  const now = new Date();
  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i); last7.push(toDateStr(d));
  }
  const week = tasks.filter(t => t.due && t.due >= last7[0] && t.due <= last7[6]);
  const dueW = week.reduce((s,t) => s + pri(t.priority).weight, 0);
  const doneW = week.filter(t => t.done).reduce((s,t) => s + pri(t.priority).weight, 0);
  const eff = dueW ? Math.round(doneW / dueW * 100) : 0;

  const doneAll = tasks.filter(t => t.done);
  const doneDays = new Set(doneAll.filter(t => t.completedAt).map(t => toDateStr(new Date(t.completedAt))));
  let streak = 0;
  let cur = new Date();
  if (!doneDays.has(toDateStr(cur))) cur.setDate(cur.getDate() - 1);
  while (doneDays.has(toDateStr(cur))) { streak++; cur.setDate(cur.getDate() - 1); }

  const perDay = last7.map(d => doneAll.filter(t => t.completedAt && toDateStr(new Date(t.completedAt)) === d).length);
  const maxDay = Math.max(1, ...perDay);
  const focusMin = doneAll.filter(t => t.completedAt && toDateStr(new Date(t.completedAt)) >= last7[0])

    <div class="data-btns">

function exportBackup() {
  const data = { app: 'arc', exported: new Date().toISOString(), tasks, vision, prefs, research };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'arc-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if ((data.app !== 'arc' && data.app !== 'meridian') || !Array.isArray(data.tasks)) throw 0;
      const date = (data.exported || 'unknown date').slice(0, 10);
      arcModal({
        message: `Replace all current data with backup from ${date}? This cannot be undone.`,
        buttons: [
          { label: 'Cancel', type: 'secondary', value: false },
          { label: 'Restore', type: 'danger', value: true },
        ]
      }).then(ok => {
        if (!ok) return;
        tasks = data.tasks;
        if (data.vision) { vision = Object.assign({ statement:'', target:'', milestones:[] }, data.vision); saveVision(); }
        if (data.prefs) { Object.assign(prefs, data.prefs); savePrefs(); }
        if (Array.isArray(data.research)) { research = data.research; saveResearch(); }
        save(); render();
      });
    } catch {
      arcModal({ message: 'That file is not a valid ARC backup.', buttons: [{ label: 'OK', type: 'primary', value: null }] });
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---- Milestone health ---- */
function milestoneHealth(ms) {
  if (!ms.target) return null;
  const now = new Date();
  const [ty, tm] = ms.target.split('-').map(Number);
  const targetDate = new Date(ty, tm - 1, 1);
  if (targetDate <= now) return { label: 'Overdue', color: '#E84444' };
  const createdDate = ms.createdAt ? new Date(ms.createdAt) : new Date(now.getFullYear() - 1, now.getMonth());
  const totalMs = Math.max(1, targetDate - createdDate);
  const elapsedMs = now - createdDate;
  const expected = Math.min(1, elapsedMs / totalMs);
  const actual = milestoneProgress(ms);
  const gap = expected - actual;
  if (gap > 0.25) return { label: 'Off track', color: '#E84444' };
  if (gap > 0.12) return { label: 'At risk', color: '#F5A623' };
  return { label: 'On track', color: '#30D158' };
}

/* ---- Vision ---- */
function renderVision() {
  const months = (() => {
    if (!vision.target) return null;
    const [ty, tm] = vision.target.split('-').map(Number);
    const now = new Date();
    return (ty - now.getFullYear()) * 12 + (tm - (now.getMonth() + 1));
  })();
  const overall = vision.milestones.length
    ? vision.milestones.reduce((s, m) => s + milestoneProgress(m), 0) / vision.milestones.length : 0;

  view.innerHTML = `
    <div class="screen-title">2-Year Vision</div>
    <textarea id="visStatement" placeholder="Who do you want to be in two years? Write it as if it is already true.">${esc(vision.statement)}</textarea>
    <div class="row" style="margin-top:12px">
      <input type="month" id="visTarget" value="${vision.target}" style="color-scheme:dark;background:var(--ink);border:1px solid var(--hairline);border-radius:10px;color:var(--ivory);padding:9px 12px;font-family:inherit;font-size:13px">
      <span class="vis-count">${
        months == null ? 'Set your target date' :
        months > 0 ? months + ' months remaining' :
        months === 0 ? 'This is the month.' : 'Target passed — set a new horizon'}</span>
    </div>

    <div class="section-label">Overall progress</div>
    <div class="progress-wrap" style="margin-top:6px">
      ${retroBar(Math.round(overall*100), '')}
    </div>

    <div class="section-label">Milestones</div>
    ${vision.milestones.length ? '' :
      `<p style="color:var(--ivory-dim);font-size:13px;line-height:1.6;padding:4px 0 8px">
        Break the vision into 4–8 concrete milestones. Then link tasks to them
        from the task editor (category: 2-Year Vision) — progress fills in by itself.</p>`}
    ${vision.milestones.map(ms => {
      const linked = tasks.filter(t => t.milestoneId === ms.id);
      const p = milestoneProgress(ms);
      const h = milestoneHealth(ms);
      return `<div class="panel" style="margin-bottom:10px">
        <div class="cat-top">
          ${linked.length ? '' : `<input type="checkbox" class="sub-check" data-msdone="${ms.id}" ${ms.done ? 'checked' : ''}>`}
          <span style="flex:1">${esc(ms.title)}</span>
          ${h ? `<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:${h.color}22;color:${h.color}">${h.label}</span>` : ''}
          <span class="count">${ms.target ? fmtMonth(ms.target) : ''}${linked.length ? ' · ' + linked.filter(t=>t.done).length + '/' + linked.length + ' tasks' : ''}</span>
          <button type="button" class="sub-del" data-msdel="${ms.id}" title="Delete">×</button>
        </div>
        <div class="cat-track" style="margin-top:10px"><div class="cat-fill" style="width:${p*100}%;background:var(--gold)"></div></div>
      </div>`;
    }).join('')}
    <div class="row" style="margin-top:6px">
      <input type="text" id="msNew" placeholder="New milestone…" style="flex:1">
      <input type="month" id="msNewT" style="color-scheme:dark;background:var(--ink);border:1px solid var(--hairline);border-radius:10px;color:var(--ivory);padding:11px 12px;font-family:inherit;font-size:13px">
      <button type="button" class="chip on" id="msAdd">Add</button>
    </div>
    <div class="footer-space"></div>`;

  document.getElementById('visStatement').addEventListener('change', e => {
    vision.statement = e.target.value; saveVision();
  });
  document.getElementById('visTarget').addEventListener('change', e => {
    vision.target = e.target.value; saveVision(); renderVision();
  });
  document.getElementById('msAdd').addEventListener('click', () => {
    const title = document.getElementById('msNew').value.trim();
    if (!title) return;
    vision.milestones.push({ id: 'ms' + Date.now(), title,
      target: document.getElementById('msNewT').value || '', done: false, createdAt: Date.now() });
    saveVision(); renderVision();
  });
  view.querySelectorAll('[data-msdel]').forEach(b => b.addEventListener('click', () => {
    arcModal({
      message: 'Delete this milestone? Linked tasks will stay but lose their milestone link.',
      buttons: [
        { label: 'Cancel', type: 'secondary', value: false },
        { label: 'Delete', type: 'danger', value: true },
      ]
    }).then(ok => {
      if (!ok) return;
      vision.milestones = vision.milestones.filter(m => m.id !== b.dataset.msdel);
      saveVision(); renderVision();
    });
  }));
  view.querySelectorAll('[data-msdone]').forEach(c => c.addEventListener('change', () => {
    const ms = vision.milestones.find(m => m.id === c.dataset.msdone);
    ms.done = c.checked; saveVision(); renderVision();
  }));
}
function fmtMonth(m) {
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, mo - 1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}

const isIndian = v => v.lang.toLowerCase().replace('_','-').startsWith('en-in');
function pickVoice() {
  const voices = englishVoices();
  if (prefs.voiceName) {
    const saved = voices.find(v => v.name === prefs.voiceName);
    if (saved) return saved;
  }
  return voices.find(v => isIndian(v) && /natural|neural/i.test(v.name)) // neural Indian English
      || voices.find(v => isIndian(v))                                   // any Indian English
      || voices.find(v => /natural/i.test(v.name))     // Edge neural voices
      || voices.find(v => /neural|premium|enhanced/i.test(v.name))
      || voices.find(v => /google/i.test(v.name))      // Chrome network voices
      || voices.find(v => /online/i.test(v.name))
      || voices.find(v => v.default) || voices[0] || null;
}
// warm the voice list (loads async in some browsers)
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => populateVoicePanel();
}

/* Group sentences into ~220-char phrases: fewer utterance boundaries
   means fewer audible stops and a smoother, more continuous read. */
function phraseChunks(text) {
  const sentences = text.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g) || [text];
  const chunks = [];
  let cur = '';
  for (const s of sentences) {
    if (cur && (cur + s).length > 220) { chunks.push(cur.trim()); cur = s; }
    else cur += s;
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}

function speakText(text) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) {           // no TTS: give reading time
      const ms = Math.min(14000, 2500 + text.split(/\s+/).length * 300);
      const iv = setInterval(() => {
        if (skipRequested || stopRequested) { clearInterval(iv); resolve(); }
      }, 150);
      setTimeout(() => { clearInterval(iv); resolve(); }, ms);
      return;
    }
    const chunks = phraseChunks(text);
    let i = 0;
    const next = () => {
      if (i >= chunks.length || skipRequested || stopRequested) return resolve();
      const u = new SpeechSynthesisUtterance(chunks[i++]);
      const v = pickVoice();
      if (v) u.voice = v;
      u.rate = prefs.rate; u.pitch = 1;
      u.onend = next; u.onerror = next;
      speechSynthesis.speak(u);
    };
    next();
  });
}

const fetchJSON = (url, ms = 6000) => {
  const ctl = new AbortController();
  setTimeout(() => ctl.abort(), ms);
  return fetch(url, { signal: ctl.signal }).then(r => { if (!r.ok) throw 0; return r.json(); });
};

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject();
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, place: '' }),
      () => reject(), { timeout: 5000, maximumAge: 3600000 });
  }).catch(() =>
    fetchJSON('https://ipwho.is/').then(d => {
      if (!d.success) throw 0;
      return { lat: d.latitude, lon: d.longitude, place: d.city };
    })
  ).catch(() =>
    fetchJSON('https://ipapi.co/json/').then(d => ({ lat: d.latitude, lon: d.longitude, place: d.city }))
  );
}

const WMO = {
  0:'clear skies',1:'mostly clear skies',2:'partly cloudy skies',3:'overcast skies',
  45:'fog',48:'freezing fog',51:'light drizzle',53:'drizzle',55:'heavy drizzle',
  56:'freezing drizzle',57:'freezing drizzle',61:'light rain',63:'rain',65:'heavy rain',
  66:'freezing rain',67:'freezing rain',71:'light snow',73:'snow',75:'heavy snow',
  77:'snow grains',80:'passing showers',81:'showers',82:'heavy showers',
  85:'snow showers',86:'snow showers',95:'a thunderstorm',96:'a thunderstorm with hail',99:'a severe thunderstorm'
};

async function weatherScript() {
  const pos = await getPosition();
  const d = await fetchJSON(
    'https://api.open-meteo.com/v1/forecast?latitude=' + pos.lat + '&longitude=' + pos.lon +
    '&current=temperature_2m,apparent_temperature,weather_code' +
    '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto');
  const t = Math.round(d.current.temperature_2m);
  const feels = Math.round(d.current.apparent_temperature);
  const hi = Math.round(d.daily.temperature_2m_max[0]);
  const lo = Math.round(d.daily.temperature_2m_min[0]);
  const rain = d.daily.precipitation_probability_max ? d.daily.precipitation_probability_max[0] : null;
  const sky = WMO[d.current.weather_code] || 'mixed conditions';
  let s = (pos.place ? 'In ' + pos.place + ', it' : 'It') + ' is currently ' + t + ' degrees with ' + sky + '.';
  if (Math.abs(feels - t) >= 3) s += ' It feels more like ' + feels + '.';
  s += ' Expect a high of ' + hi + ' and a low of ' + lo + ' today.';
  const art = /^(8|11$|18)/.test(String(rain)) ? 'an' : 'a';
  if (rain != null && rain >= 50) s += ' There is ' + art + ' ' + rain + ' percent chance of rain, so an umbrella might be wise.';
  else if (rain != null && rain >= 25) s += ' ' + art.charAt(0).toUpperCase() + art.slice(1) + ' ' + rain + ' percent chance of rain — probably fine, but keep an eye on the sky.';
  return s;
}

const FEED_WORLD = 'https://feeds.bbci.co.uk/news/world/rss.xml';
/* Indian news candidates, most reliable first; The Hindu and Indian Express
   are UPSC staples but often block proxies — used when reachable. */
const FEEDS_INDIA = [
  'https://feeds.bbci.co.uk/news/world/asia/india/rss.xml',
  'https://www.thehindu.com/news/national/feeder/default.rss',
  'https://indianexpress.com/section/india/feed/'
];
/* Themes that matter for UPSC prelims/mains current affairs */
const UPSC_RX = /supreme court|high court|parliament|lok sabha|rajya sabha|\bbill\b|\bact\b|policy|scheme|yojana|ministry|cabinet|\brbi\b|gdp|inflation|budget|fiscal|election commission|\bsebi\b|niti aayog|isro|drdo|summit|treaty|environment|climate|wildlife|forest|tribunal|constitution|amendment|governor|judiciary|reservation|census|g20|\bun\b|\bwho\b|commission|federal|panchayat|agreement|mission/i;

async function fetchFeed(url, ms) {
  const ctl = new AbortController();
  setTimeout(() => ctl.abort(), ms);
  const r = await fetch(url, { signal: ctl.signal });
  if (!r.ok) throw 0;
  return r.text();
}
async function fetchTitles(feed) {
  let text;
  try {
    text = await fetchFeed('https://corsproxy.io/?url=' + encodeURIComponent(feed), 12000);
  } catch {
    text = await fetchFeed('https://api.allorigins.win/raw?url=' + encodeURIComponent(feed), 25000);
  }
  const xml = new DOMParser().parseFromString(text, 'text/xml');
  return [...xml.querySelectorAll('item > title')].map(n => n.textContent.trim()).filter(Boolean);
}
async function fetchTitlesAny(feeds) {
  for (const f of feeds) {
    try { const t = await fetchTitles(f); if (t.length) return t; } catch { /* next */ }
  }
  throw 0;
}
async function newsScript() {
  const [world, india] = await Promise.allSettled([fetchTitles(FEED_WORLD), fetchTitlesAny(FEEDS_INDIA)]);
  const parts = [];
  if (world.status === 'fulfilled' && world.value.length) {
    parts.push('A quick look at the world. ' +
      world.value.slice(0, 3).map((t, i) => (i + 1) + '. ' + t + '.').join(' '));
  }
  if (india.status === 'fulfilled' && india.value.length) {
    // Surface UPSC-relevant stories first, keep original order otherwise
    const relevant = india.value.filter(t => UPSC_RX.test(t));
    const rest = india.value.filter(t => !UPSC_RX.test(t));
    const picks = [...relevant, ...rest].slice(0, 4);
    parts.push('Now, from India — worth noting for your UPSC preparation. ' +
      picks.map((t, i) => (i + 1) + '. ' + t + '.').join(' '));
  }
  if (!parts.length) throw 0;
  return parts.join(' ');
}

function scheduleScript() {
  const plan = planDay(todayStr());
  const taskBlocks = plan.blocks.filter(b => !b.lunch);
  if (!taskBlocks.length && !plan.overflow.length)
    return 'Your schedule is clear today. A good moment to invest in your two year vision — or simply rest.';
  const mins = taskBlocks.reduce((s, b) => s + (b.end - b.start), 0);
  const hours = mins >= 60 ? Math.floor(mins / 60) + (mins % 60 ? ' and a half' : '') + ' hours' : mins + ' minutes';
  const say = m => fmtTime(Math.floor(m / 60), m % 60).replace(':00', " o'clock");
  let s = 'Now, your day. You have ' + taskBlocks.length +
    (taskBlocks.length === 1 ? ' task' : ' tasks') + ' planned, about ' + hours + ' of focused effort. ';
  for (const b of taskBlocks)
    s += 'At ' + say(b.start) + ', ' + b.task.title + ' — ' + pri(b.task.priority).label.toLowerCase() +
         ' priority, ' + (b.end - b.start) + ' minutes. ';
  if (plan.overflow.length)
    s += 'Also on your list, when you find a moment: ' + plan.overflow.map(t => t.title).join('; ') + '.';
  return s;
}

function renderMeeting() {

  if (meetingMode === 'work') {
    const workTasks = tasks.filter(t => t.category === 'WORK');
    const inProgress = workTasks.filter(t => !t.done && t.inProgress).sort((a,b) => (b.priority?.weight||0)-(a.priority?.weight||0));
    const pending    = workTasks.filter(t => !t.done && !t.inProgress).sort((a,b) => (b.priority?.weight||0)-(a.priority?.weight||0));

        </div>

    }

    let html = '';
    if (inProgress.length) { html += `<div class="meeting-group-label">Being worked on · ${inProgress.length}</div>${inProgress.map(workTaskRow).join('')}`; }
    if (pending.length)    { html += `<div class="meeting-group-label">Pending · ${pending.length}</div>${pending.map(workTaskRow).join('')}`; }
    if (done.length)       { html += `<div class="meeting-group-label">Completed tasks · ${done.length}</div>${done.map(workTaskRow).join('')}`; }
    if (!workTasks.length) html = `<div style="padding:30px 0 0;text-align:center;color:var(--ivory-faint);font-size:15px">No Work tasks yet</div>`;
    html += `<div class="mt-add-row">
      <input class="mt-add-input" id="mtAddWork" placeholder="Add a Work task…">
      <button class="mt-add-go" data-mtaddgo="work">+</button>
    </div><div class="footer-space"></div>`;
    body.innerHTML = html;

    // Enter key on subtask inputs
    body.querySelectorAll('.mt-sub-input').forEach(inp => {
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); mtAddSub(inp.dataset.mtaddsub, inp); } });
    });
    const workInp = body.querySelector('#mtAddWork');
    if (workInp) workInp.addEventListener('keydown', ev => { if (ev.key === 'Enter') mtAddWorkTask(workInp); });

    // Auto-expand feedback textareas (fallback for browsers without field-sizing:content)
    body.querySelectorAll('.mt-feedback-input').forEach(ta => {
      const resize = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
      ta.addEventListener('input', resize);
      resize();
    });

  } else {
    let html = '';
    if (!research.length) {
      html = `<div style="padding:30px 0;text-align:center;color:var(--ivory-faint);font-size:15px">No research projects yet</div>`;
    } else {

    // Enter on research task inputs

      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') mtAddRpTask(inp.dataset.mtrpadd, inp); });
    });
  }
}

function mtAddSub(taskId, inp) {
  const val = inp.value.trim(); if (!val) return;
  const t = tasks.find(x => x.id === taskId); if (!t) return;
  if (!t.subs) t.subs = [];
  t.subs.push({ text: val, done: false });
  save(); renderMeeting();
}

function mtAddWorkTask(inp) {
  const val = inp.value.trim(); if (!val) return;
  const id = uid();
  tasks.push({ id, done: false, completedAt: null, createdAt: Date.now(),
    notifiedAt: null, nextSpawned: false, seriesId: null,
    title: val, notes: '', category: 'WORK', priority: 'MEDIUM',
    estimate: 30, due: todayStr(), fixedTime: null, repeat: '',
    reminder: null, reminderDate: null, subs: [], milestoneId: null });
  save(); renderMeeting();
}

function mtAddRpTask(projId, inp) {
  const val = inp.value.trim(); if (!val) return;
  const proj = research.find(p => p.id === projId); if (!proj) return;
  proj.tasks.push({ id: uid(), title: val, done: false, notes: '', startDate: null, due: null });
  saveResearch(); renderMeeting();
}

}

function closeMeeting() {

    });
  });

  // Task date range auto-save on change
  view.querySelectorAll('[data-rptaskstart],[data-rptaskdue]').forEach(inp => {
    inp.addEventListener('change', () => {
      const proj = research.find(p => p.id === (inp.dataset.rptaskstart || inp.dataset.rptaskdue));
      const task = proj && proj.tasks.find(t => t.id === inp.dataset.rptaskid);
      if (!task) return;
      if (inp.dataset.rptaskstart !== undefined) task.startDate = inp.value || null;
      if (inp.dataset.rptaskdue   !== undefined) task.due       = inp.value || null;
      saveResearch();
    });
  });
}

async function startBrief() {
  if (briefRunning) return;
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  briefRunning = true; stopRequested = false;
  briefEl.classList.add('open');
  renderPrefChips();

  const hour = new Date().getHours();
  const dayName = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const opening = (hour < 12 ? 'Good morning.' : hour < 17 ? 'Good afternoon.' : 'Good evening.') +
    ' Today is ' + dayName + '. Here is your brief.';

  // Start network work immediately so it's ready by the time the welcome ends
  const weatherJob = prefs.weather ? weatherScript().catch(() => null) : null;
  const newsJob = prefs.news ? newsScript().catch(() => null) : null;

  const sections = [
    { name: 'Welcome', get: async () => opening },
    ...(prefs.weather ? [{ name: 'Weather',
        get: async () => { const v = await weatherJob; if (!v) throw 0; return v; },
        fail: 'Weather is unavailable right now, moving on.' }] : []),
    ...(prefs.news ? [{ name: 'Headlines',
        get: async () => { const v = await newsJob; if (!v) throw 0; return v; },
        fail: 'The headlines are unavailable right now, moving on.' }] : []),
    { name: 'Your day', get: async () => scheduleScript() },
    { name: 'Go well', get: async () => 'That is everything. Move with intention — one block at a time. Have a great day.' },
  ];

  for (const sec of sections) {
    if (stopRequested) break;
    skipRequested = false;
    briefSection.textContent = sec.name;
    briefText.textContent = '…';
    let text;
    try { text = await sec.get(); } catch { text = sec.fail; }
    if (stopRequested) break;
    if (skipRequested || !text) continue;
    briefText.textContent = text;
    await speakText(text);
  }
  endBrief();
}

function endBrief() {
  stopRequested = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  briefEl.classList.remove('open');

}

function populateVoicePanel() {

  const voices = englishVoices().sort((a, b) =>

    (/natural|neural/i.test(b.name) - /natural|neural/i.test(a.name)));
  const chosen = pickVoice();
  sel.innerHTML = voices.map(v =>
    `<option value="${esc(v.name)}" ${chosen && v.name === chosen.name ? 'selected' : ''}>${isIndian(v) ? '🇮🇳 ' : ''}${esc(v.name.replace(/Microsoft |Google /,'') )}${/natural|neural/i.test(v.name) ? ' ★' : ''}</option>`
  ).join('');
  document.querySelectorAll('#voicePanel [data-rate]').forEach(b =>
    b.classList.toggle('on', Number(b.dataset.rate) === prefs.rate));
  const hasIndian = voices.some(isIndian);

  document.getElementById('voiceHint').textContent = hasIndian
    ? (hasNeural ? '🇮🇳 marks Indian English voices, ★ the most natural ones.'

}

const arcModalBg = document.getElementById('arcModalBg');

const arcModalInput = document.getElementById('arcModalInput');

function arcModal({ message, input = false, placeholder = '', buttons }) {
  return new Promise(resolve => {
    arcModalMsg.textContent = message;
    arcModalInput.style.display = input ? '' : 'none';
    arcModalInput.value = '';
    arcModalInput.placeholder = placeholder;
    arcModalBtns.innerHTML = '';
    buttons.forEach(({ label, type = 'secondary', value }) => {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.className = 'arc-modal-btn ' + type;
      btn.addEventListener('click', () => {
        arcModalBg.classList.remove('open');
        resolve(input ? (value !== undefined ? value : arcModalInput.value.trim()) : value);
      });
      arcModalBtns.appendChild(btn);
    });
    arcModalBg.classList.add('open');
    if (input) setTimeout(() => arcModalInput.focus(), 60);
  });

/* ================= Undo ================= */
const snackEl = document.getElementById('snack');
let snackTimer = null, snackAction = null;
function showUndo(msg, undoFn) {
  document.getElementById('snackMsg').textContent = msg;
  snackAction = undoFn;
  snackEl.classList.add('open');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => snackEl.classList.remove('open'), 5000);
}
document.getElementById('snackUndo').addEventListener('click', () => {
  if (snackAction) snackAction();
  snackAction = null;
  snackEl.classList.remove('open');
});
/* Snapshot-based undo: any task mutation can be rolled back wholesale */
function withUndo(label, mutate) {
  const snap = JSON.stringify(tasks);
  mutate();
  save(); render();
  showUndo(label, () => { tasks = JSON.parse(snap); save(); render(); });
}

function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  withUndo(t.done ? 'Marked "' + t.title + '" not done' : 'Completed "' + t.title + '"', () => {
    t.done = !t.done;
    t.completedAt = t.done ? Date.now() : null;
    t.updatedAt = Date.now();
    // Repeating task completed → queue the next occurrence (once)
    if (t.done && t.repeat && t.due && !t.nextSpawned) {
      const due = nextDueDate(t.due, t.repeat);
      if (due) {
        const id2 = uid();
        // Recalculate reminderDate to preserve the same day-offset relative to new due
        let newReminderDate = null;
        if (t.reminderDate && t.due) {
          const offsetDays = Math.round(
            (new Date(t.reminderDate + 'T00:00:00') - new Date(t.due + 'T00:00:00')) / 86400000
          );
          newReminderDate = offsetDays !== 0 ? offsetDate(due, offsetDays) : null;
        }
        tasks.push({ ...t, id: id2, seriesId: t.seriesId || t.id,
                     due, done: false, completedAt: null, notifiedAt: null,
                     nextSpawned: false, createdAt: Date.now(),
                     reminderDate: newReminderDate });
        t.nextSpawned = true;
      }
    }
  });
}

/* ---- What Now? ---- */
function whatNow() {
  const plan = planDay(todayStr());
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const cur = plan.blocks.find(b => !b.lunch && b.start <= nowMin && b.end > nowMin && !b.task.done);
  if (cur) {
    arcModal({ message: `Focus on: "${cur.task.title}"\n${fmtTime(Math.floor(cur.start/60),cur.start%60)} – ${fmtTime(Math.floor(cur.end/60),cur.end%60)}`, buttons:[{label:'Got it',type:'primary',value:null}] });
    return;
  }
  const next = plan.blocks.find(b => !b.lunch && b.start > nowMin && !b.task.done);
  if (next) {
    const gap = next.start - nowMin;
    arcModal({ message: `Next: "${next.task.title}" at ${fmtTime(Math.floor(next.start/60),next.start%60)}.\nYou have ${gap} min — take a break or do a quick task.`, buttons:[{label:'Got it',type:'primary',value:null}] });
    return;
  }
  if (plan.overflow.length) {
    arcModal({ message: `"${plan.overflow[0].title}" didn't fit today's schedule. Consider rescheduling or dropping it.`, buttons:[{label:'Got it',type:'primary',value:null}] });
    return;
  }
  arcModal({ message: plan.completed.length ? `All done for today. Great work.` : `Nothing planned. Tap + to add your first task.`, buttons:[{label:'Nice',type:'primary',value:null}] });
}

document.getElementById('meeting').addEventListener('click', e => {
  if (e.target.closest('#meetingCloseBtn')) { closeMeeting(); return; }

  // Meeting mode toggle
  const modeBtn = e.target.closest('.meeting-toggle-btn');
  if (modeBtn) { meetingMode = modeBtn.dataset.mode; meetingExpandedId = null; renderMeeting(); return; }

  if (!e.target.closest('#meetingBody')) return;

  // Toggle work task done
  const mtToggle = e.target.closest('[data-mttoggle]');
  if (mtToggle) { toggleTask(mtToggle.dataset.mttoggle); renderMeeting(); return; }

  // Expand/collapse work task subtasks
  const mtExp = e.target.closest('[data-mtexp]');
  if (mtExp) {
    meetingExpandedId = meetingExpandedId === mtExp.dataset.mtexp ? null : mtExp.dataset.mtexp;
    renderMeeting(); return;
  }

  // Toggle feedback panel
  const mtFb = e.target.closest('[data-mtfb]');
  if (mtFb) {
    meetingFeedbackId = meetingFeedbackId === mtFb.dataset.mtfb ? null : mtFb.dataset.mtfb;
    renderMeeting();
    if (meetingFeedbackId) {
      const inp = document.getElementById('fbInput_' + meetingFeedbackId);
      if (inp) { inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
    }
    return;
  }

  // Save feedback
  const mtFbSave = e.target.closest('[data-mtfeedbacksave]');
  if (mtFbSave) {
    const t = tasks.find(x => x.id === mtFbSave.dataset.mtfeedbacksave);
    if (t) {
      const inp = document.getElementById('fbInput_' + t.id);
      t.meetingNote = inp ? inp.value.trim() : '';
      save();
    }
    meetingFeedbackId = null;
    renderMeeting(); return;
  }

  // Delete work task
  const mtDel = e.target.closest('[data-mtdel]');
  if (mtDel) {
    withUndo('Deleted task', () => { tasks = tasks.filter(x => x.id !== mtDel.dataset.mtdel); });
    renderMeeting(); return;
  }

  // Tick subtask on a work task
  const mtSub = e.target.closest('[data-mtsub]');
  if (mtSub) {
    const t = tasks.find(x => x.id === mtSub.dataset.mtsub);
    if (t && t.subs) { t.subs[Number(mtSub.dataset.idx)].done = !t.subs[Number(mtSub.dataset.idx)].done; save(); }
    renderMeeting(); return;
  }

  // Delete subtask on a work task
  const mtDelSub = e.target.closest('[data-mtdelsub]');
  if (mtDelSub) {
    const t = tasks.find(x => x.id === mtDelSub.dataset.mtdelsub);
    if (t && t.subs) { t.subs.splice(Number(mtDelSub.dataset.idx), 1); save(); }
    renderMeeting(); return;
  }

  // Add work task via + button
  const mtAddGo = e.target.closest('[data-mtaddgo]');
  if (mtAddGo) {
    const inp = document.getElementById('mtAddWork');
    if (inp) mtAddWorkTask(inp); return;
  }

  // Expand/collapse research project in meeting
  const mtProjExp = e.target.closest('[data-mtprojexp]');
  if (mtProjExp) {
    meetingExpandedId = meetingExpandedId === mtProjExp.dataset.mtprojexp ? null : mtProjExp.dataset.mtprojexp;
    renderMeeting(); return;
  }

  // Add research task via + button in meeting
  const mtRpAddGo = e.target.closest('[data-mtrpaddgo]');
  if (mtRpAddGo) {
    const inp = document.querySelector(`[data-mtrpadd="${mtRpAddGo.dataset.mtrpaddgo}"]`);
    if (inp) mtAddRpTask(mtRpAddGo.dataset.mtrpaddgo, inp); return;
  }

  // Research task tick (from meeting body)
  const rpTick = e.target.closest('[data-rptick]');
  if (rpTick) {
    rpToggleItem(rpTick.dataset.rptick, rpTick.dataset.rpitem, rpTick.dataset.rpitemid);
    renderMeeting(); return;
  }

  // Research task delete (from meeting body)
  const rpDelM = e.target.closest('[data-rpdel]');
  if (rpDelM) {
    rpDeleteItem(rpDelM.dataset.rpdel, rpDelM.dataset.rpitem, rpDelM.dataset.rpitemid);
    renderMeeting(); return;
  }

  // Edit task from meeting
  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) { openEditor(tasks.find(x => x.id === editBtn.dataset.edit)); return; }
});

let lastSwipeAt = 0;
document.getElementById('view').addEventListener('click', e => {
  if (Date.now() - lastSwipeAt < 400) return;
  if (e.target.closest('#briefBtn')) { startBrief(); return; }
  if (e.target.closest('#meetingBtn')) { openMeeting(); return; }
  if (e.target.closest('#whatNowBtn')) { whatNow(); return; }
  if (e.target.closest('#searchBtn')) { openSearch(); return; }

  // Research: rename project title (inline)
  const rpRename = e.target.closest('[data-rprename]');
  if (rpRename) {
    e.stopPropagation();
    const projId = rpRename.dataset.rprename;
    const proj = research.find(p => p.id === projId); if (!proj) return;
    const inp = document.createElement('input');
    inp.type = 'text'; inp.value = proj.title;
    inp.className = 'rp-rename-input';
    rpRename.replaceWith(inp); inp.focus(); inp.select();
    const commit = () => {
      const val = inp.value.trim();
      if (val) { proj.title = val; saveResearch(); }
      expandedProjectId = projId; renderResearch();
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
      if (ev.key === 'Escape') { expandedProjectId = projId; renderResearch(); }
    });
    return;
  }

  // Research task expand/collapse (notes + dates)
  const rpTaskExp = e.target.closest('[data-rptaskexp]');
  if (rpTaskExp) {
    e.stopPropagation();
    const id = rpTaskExp.dataset.rptaskexp;
    expandedRpTaskId = expandedRpTaskId === id ? null : id;
    renderResearch(); return;
  }

  // Research screen: expand/collapse — only fire when clicking the header, not the body
  const rpOpen = e.target.closest('.rp-tile-head[data-rpopen]');
  if (rpOpen && !e.target.closest('[data-rprename]')) {
    const id = rpOpen.dataset.rpopen;
    expandedProjectId = expandedProjectId === id ? null : id;
    renderResearch(); return;
  }

  // Research: tick task/target
  const rpCheck = e.target.closest('[data-rptick]');
  if (rpCheck) {
    rpToggleItem(rpCheck.dataset.rptick, rpCheck.dataset.rpitem, rpCheck.dataset.rpitemid); return;
  }

  // Research: delete item
  const rpDel = e.target.closest('[data-rpdel]');
  if (rpDel) {
    rpDeleteItem(rpDel.dataset.rpdel, rpDel.dataset.rpitem, rpDel.dataset.rpitemid); return;
  }

  // Research: delete project
  const rpDelProj = e.target.closest('[data-rpdelproj]');
  if (rpDelProj) {
    const projId = rpDelProj.dataset.rpdelproj;
    arcModal({
      message: 'Delete this research project? All tasks, targets and notes will be lost.',
      buttons: [
        { label: 'Cancel', type: 'secondary', value: false },
        { label: 'Delete', type: 'danger', value: true },
      ]
    }).then(ok => {
      if (!ok) return;
      research = research.filter(p => p.id !== projId);
      expandedProjectId = null; saveResearch(); renderResearch();
    });
    return;
  }

  // Research: add item via button
  const rpAddGo = e.target.closest('[data-rpaddgo]');
  if (rpAddGo) {
    const input = document.querySelector(`[data-rpadd="${rpAddGo.dataset.rpaddgo}"][data-rpitem="${rpAddGo.dataset.rpitem}"]`);
    if (input) rpAddItem(rpAddGo.dataset.rpaddgo, rpAddGo.dataset.rpitem, input); return;
  }

  // Triage buttons
  const tri = e.target.closest('[data-tri]');
  if (tri) {
    const t = tasks.find(x => x.id === tri.dataset.id);
    if (!t) return;
    if (tri.dataset.tri === 'drop') {
      withUndo('Dropped "' + t.title + '"', () => { tasks = tasks.filter(x => x.id !== t.id); });
    } else if (tri.dataset.tri === 'today') {
      withUndo('Moved to today', () => { t.due = todayStr(); });
    } else {
      const d = new Date(); d.setDate(d.getDate() + 1);
      withUndo('Moved to tomorrow', () => { t.due = toDateStr(d); });
    }
    return;
  }

  // Task completion circle
  const check = e.target.closest('[data-toggle]');
  if (check) { e.stopPropagation(); toggleTask(check.dataset.toggle); return; }

  // Edit button (pencil icon) → open full editor
  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    e.stopPropagation();
    openEditor(tasks.find(x => x.id === editBtn.dataset.edit));
    return;
  }

  // Inline subtask checkbox tick
  const subtick = e.target.closest('[data-subtick]');
  if (subtick) {
    e.stopPropagation();
    const t = tasks.find(x => x.id === subtick.dataset.subtick);
    if (!t || !t.subs) return;
    const idx = Number(subtick.dataset.idx);
    t.subs[idx].done = !t.subs[idx].done;
    save(); render();
    return;
  }

  // "+ Add step" button → show inline input
  const addStep = e.target.closest('[data-addstep]');
  if (addStep) {
    e.stopPropagation();
    const t = tasks.find(x => x.id === addStep.dataset.addstep);
    if (!t) return;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Step description…';
    inp.className = 'sub-inline-input';
    addStep.before(inp);
    addStep.style.display = 'none';
    inp.focus();
    const commit = () => {
      const text = inp.value.trim();
      inp.value = '';
      if (text) { if (!t.subs) t.subs = []; t.subs.push({ text, done: false }); save(); }
      render();
    };
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); commit(); } if (ev.key === 'Escape') render(); });
    inp.addEventListener('blur', commit);
    return;
  }

  // Task body click → expand / collapse subtasks inline
  const expand = e.target.closest('[data-expand]');
  if (expand) {
    e.stopPropagation();
    const id = expand.dataset.expand;
    expandedTaskId = expandedTaskId === id ? null : id;
    render();
    return;
  }
});
